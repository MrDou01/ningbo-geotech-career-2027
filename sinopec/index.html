方评分标准。","tip":"用证据表达异议，不把分歧变成人身冲突。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E037","category":"思想素质","topic":"长期主义","difficulty":1,"stem":"某项培训短期内看不到考核加分，但与你未来岗位需要密切相关。较好的选择是？","options":["结合岗位需求制定持续学习计划，定期用实际任务检验收获","只学习能立即计入绩效的内容","一次性学习所有知识，之后不再练习","把参加培训次数当成能力提高的唯一证据"],"answer":0,"explanation":"建议选择：学习价值应看实际能力与岗位适应，短期考核不是唯一尺度。持续练习和实际运用比次数或一次性突击更有效。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"学习看能力变化，不只看记录。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E038","category":"思想素质","topic":"公平竞争","difficulty":2,"stem":"你参加内部方案竞选，意外获得竞争团队尚未公开的材料。最合适的是？","options":["参考后改写措辞，避免看出来源","停止传播和使用，向指定渠道说明来源并按要求处理","只给自己团队核心成员看","以对方保管不善为由直接使用"],"answer":1,"explanation":"建议选择：竞争应基于正当获得的信息。误收资料不等于有权使用，限制传播并按程序处理有助于维护公平。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"获得信息不等于有权使用。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E039","category":"思想素质","topic":"节约资源","difficulty":2,"stem":"打印机旁经常遗留单面打印的普通非保密废纸，你负责提出节约措施。较妥当的是？","options":["把所有纸张无差别收集给外部人员使用","禁止任何纸质打印，不考虑必要需求","核实回收使用条件，设置分类回收与双面打印默认选项并提醒保密要求","只批评浪费，不改变设备设置与流程"],"answer":2,"explanation":"建议选择：节约应兼顾实际需求与信息安全。默认设置、分类和明确规则能减少浪费，无差别再利用可能造成信息风险。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"节约要有规则，也要顾及保密。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E040","category":"思想素质","topic":"问题闭环","difficulty":3,"stem":"你已向支持人员报告影响业务的系统故障，后续哪些做法有助于形成闭环？（多选）","options":["确认预计处理节点与业务临时安排","收到“已记录”就认为已经修复","故障恢复后验证业务功能","未经授权自行改后台数据以加快处理"],"answer":[0,2],"explanation":"建议选择：故障上报、过程跟踪和恢复验证是不同环节。记录不等于修复，越权修改可能扩大损害。 此为原创练习参考判断，不代表官方题型安排或评分标准。","tip":"上报不等于解决，恢复需要验证。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质","type":"multiple"},{"id":"E041","category":"思想素质","topic":"尊重同事","difficulty":1,"stem":"团队成员因身体状况短期无法承担原有工作强度，已按规定说明。合理做法是？","options":["在职责和资源允许范围内协调安排，尊重隐私并共同保证任务衔接","要求其公开全部病情以证明没有偷懒","认为所有帮助都会影响公平，一律拒绝协调","替其承诺长期免除所有职责，不经协商"],"answer":0,"explanation":"建议选择：人本与组织效率可以通过合理调整兼顾。尊重隐私、按规则协商支持，比怀疑、公开隐私或擅自承诺更妥当。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"帮助有边界，尊重有原则。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E042","category":"思想素质","topic":"质量沟通","difficulty":2,"stem":"检查发现同事交付物存在缺陷，但对方认为你在“挑刺”。应如何沟通？","options":["为了不伤感情直接验收","引用约定标准和具体证据，说明影响，与其商定修正办法","在同事面前讽刺其能力","只重复“你不合格”，不说明问题"],"answer":1,"explanation":"建议选择：质量反馈应针对成果与标准，并指向可落实的修正。妥协、讽刺和笼统否定都不利于问题解决。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"对事给证据，对改进给方向。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E043","category":"思想素质","topic":"责任协同","difficulty":2,"stem":"你发现一个不在自己岗位职责范围内的问题，但可能影响后续团队工作。应？","options":["因为不属于自己职责就不理会","直接替对方作所有决策，不需沟通","通知有职责的人员并提供所知信息，必要时协助跟踪，避免越权处置","先在公开平台发布问题，等待关注"],"answer":2,"explanation":"建议选择：责任感包括发现和转交问题，担当不意味着越过所有权限。把问题送达正确责任人并适度协助更有效。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"职责外问题也要送达合适的人。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E044","category":"思想素质","topic":"试点评估","difficulty":3,"stem":"一项新方法在一次试验中效果很好，有人建议据此宣布“全面优于旧方法”。应如何判断？","options":["立即宣传全面领先以扩大影响","因只有一次试验就认定方法毫无价值","只重复成功条件下的试验，不测试其他场景","说明试验条件和样本局限，增加验证并比较适用边界后再下结论"],"answer":3,"explanation":"建议选择：单次成功提供线索但不能证明全面适用。既不夸大也不否定，应明确条件、重复验证和边界。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"一次成功是证据起点，不是普遍结论。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E045","category":"思想素质","topic":"勤勉履职","difficulty":1,"stem":"无人监督的夜班中，一项例行检查往常很少发现问题。合适的做法是？","options":["仍按有效要求完成检查并真实记录，发现流程不合理另行提建议","因很少出问题就跳过本次检查","照抄上一班的检查结果","先填正常，等出问题再修改"],"answer":0,"explanation":"建议选择：履职标准不因监督是否在场而变化。历史正常不能代替本次检查；流程优化应通过正式改进而非虚假记录。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"有没有监督，标准一致。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E046","category":"思想素质","topic":"沟通分歧","difficulty":2,"stem":"同事公开否定你的方案，你感到受挫，但对方指出的数据口径问题确实存在。应？","options":["因对方态度不好而拒绝所有意见","承认有效问题，核对口径并修订分析，对表达方式的分歧另行沟通","立即修改所有结论，只为结束争论","转而寻找对方过去的错误作为反击"],"answer":1,"explanation":"建议选择：应将观点是否正确与表达方式是否合适分开处理。先修正有效问题，情绪和沟通问题再恰当反馈。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"能承认有效批评，是成熟而非示弱。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E047","category":"思想素质","topic":"自律与诚信","difficulty":2,"stem":"线上培训要求本人完成学习与测验，你已经较熟悉内容但仍需参加。应？","options":["请同事代登录并提交测验","让程序替自己挂机，认为结果相同","按要求完成，若可申请免修则走正式流程","交换账号互相代考以节约时间"],"answer":2,"explanation":"建议选择：熟悉内容不意味着可以虚构参与或替考。规则若有免修机制可使用，但不能自行伪造学习记录。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"减少重复走正规渠道，不伪造过程。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E048","category":"思想素质","topic":"科学精神","difficulty":3,"stem":"某个流行说法被许多人转发，但与当前实验数据不一致。作为研究人员应？","options":["因为转发多就修改数据使之符合","认为凡流行说法都必然错误","只寻找支持自己观点的文献","检查数据和说法的证据质量与适用条件，保留不确定性并继续验证"],"answer":3,"explanation":"建议选择：科学判断重证据、方法与边界。不能以热度替代证据，也不能预设反对立场或只选择有利资料。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"既核查数据，也核查主张的依据。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E049","category":"思想素质","topic":"保密边界","difficulty":1,"stem":"同部门同事出于好奇想查看与你共同工作无关的员工个人资料，且未获授权。应？","options":["拒绝无业务需要的访问，按制度使用必要资料并保护个人信息","因为是同部门就给他看","只允许看不允许拍照，认为不算泄露","把信息去掉姓名但保留可识别细节后提供"],"answer":0,"explanation":"建议选择：信息使用应符合业务必要性和授权范围。同部门、口头查看或不充分去标识都不能替代权限。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"同事身份不自动产生全部访问权。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E050","category":"思想素质","topic":"组织效率","difficulty":2,"stem":"每周汇总表中有几项数据已不再用于任何决策，重复填报占用很多时间。合理做法是？","options":["不通知任何人，直接停报所有表格","收集使用情况并提出精简建议，确认需求和批准变更后调整","继续机械填报，认为不能提出意见","随意填估算值以减少工作量"],"answer":1,"explanation":"建议选择：求真务实也包括减少无效工作，但需核实需求并协调变更。停报或造数会影响其他使用者。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"改进流程要先核实用途。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E051","category":"思想素质","topic":"风险表达","difficulty":2,"stem":"报告低概率但后果严重的风险时，哪些信息应清晰说明？（多选）","options":["判断概率的依据和不确定性","可能造成的后果","可采取的控制措施","只提供最乐观情形以免影响决策"],"answer":[0,1,2],"explanation":"建议选择：风险沟通应包含依据、可能性、后果和控制措施，且对不确定性透明；只呈现乐观情形会误导判断。 此为原创练习参考判断，不代表官方题型安排或评分标准。","tip":"风险既看概率，也看后果。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质","type":"multiple"},{"id":"E052","category":"思想素质","topic":"共同成长","difficulty":3,"stem":"你掌握一项能提高团队效率的操作技巧，但担心分享后自己不再突出。较合适的是？","options":["只在别人遇到问题时收费传授","刻意隐瞒关键步骤，保持别人依赖","让同事试错以证明自己的价值","在不涉及限制信息的前提下整理并分享，继续提升自身能力"],"answer":3,"explanation":"建议选择：团队协作强调共同提高。分享合规知识能减少重复成本，个人优势也可以通过持续学习形成，而非制造依赖。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"共享合规知识，靠成长保持优势。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E053","category":"思想素质","topic":"合理坚持","difficulty":1,"stem":"你负责的方案遇到困难，经连续验证发现关键前提不成立。对“坚持到底”的正确理解是？","options":["坚持解决问题的目标，根据证据调整路线并及时沟通","无论证据如何都继续原方案","马上停止全部工作，也不总结原因","隐瞒前提失败，争取更多资源继续尝试"],"answer":0,"explanation":"建议选择：意志品质是对目标负责，并非固守被证伪的方法。根据证据调整路线、保存学习成果体现理性韧性。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"坚持目标，方法可依证据调整。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E054","category":"思想素质","topic":"应急责任","difficulty":2,"stem":"演练中你发现疏散引导标识存在容易误解的地方，但本次演练没有发生事故。应？","options":["认为没有事故就不用处理","记录具体位置和误解情形，报告并推动验证整改效果","只提醒熟悉的同事，避免增加工作","在未获允许时随意改变全部标识"],"answer":1,"explanation":"建议选择：演练价值在于发现潜在问题。未发生事故不代表隐患不存在，应通过适当程序整改和复核。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"未出事故也要消除发现的问题。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E055","category":"思想素质","topic":"价值取舍","difficulty":2,"stem":"某考核指标可以通过把问题转给下游环节来改善，但会增加整个团队的返工和风险。你应？","options":["只要本岗位指标变好就采用","让下游自己解决，不讨论整体影响","从全流程效果评估，说明局部指标的局限并提出协同改进","为了避免指标压力不再记录相关数据"],"answer":2,"explanation":"建议选择：责任应覆盖整体结果，不能为局部好看转嫁成本。揭示指标局限并协同优化，比隐瞒或推责更符合组织目标。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"局部最优不一定带来整体最优。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E056","category":"企业文化","topic":"企业使命","difficulty":1,"stem":"中国石化公开企业文化资料中，企业使命是？","options":["能源至净，生活至美","建设世界领先现代化能源与化工公司","爱我中华、振兴石化","为美好生活加油"],"answer":3,"explanation":"企业使命强调持续提供能源化工产品和服务、改善生活。本题仅核对公开企业文化事实，不代表本届必考。","tip":"使命回答为什么存在。","sourceIds":["S04"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E057","category":"企业文化","topic":"核心价值观","difficulty":1,"stem":"下列哪组与中国石化公开的六项核心价值观相符？","options":["人本、责任、诚信、精细、创新、共赢","人本、责任、诚信、精细、创新、竞争","人本、责任、速度、精细、创新、共赢","人本、规模、诚信、精细、保守、共赢"],"answer":0,"explanation":"六项价值观应作为一组理解；不要与某家下属企业的特色文化或其他公司的口号混淆。","tip":"六项：人本、责任、诚信、精细、创新、共赢。","sourceIds":["S05"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E058","category":"企业文化","topic":"企业精神","difficulty":1,"stem":"中国石化公开企业文化资料中，企业精神为？","options":["为美好生活加油","爱我中华、振兴石化","担当、务实、智慧","严、细、实"],"answer":1,"explanation":"企业精神与企业使命属于不同概念；本题考的是企业精神。","tip":"精神侧重共同情怀与动力。","sourceIds":["S06"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E059","category":"企业文化","topic":"企业作风","difficulty":1,"stem":"中国石化公开企业文化资料列示的企业作风是？","options":["严、细、实、精","担当、务实、智慧","严、细、实","开放、创新、奋勇、争先"],"answer":2,"explanation":"企业作风强调严谨要求、细致执行和实事求是；不能把形式声势替代实际效果。","tip":"严要求、重细节、求实效。","sourceIds":["S05"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E060","category":"企业文化","topic":"三老四严","difficulty":1,"stem":"石油精神中的“三老”，主要强调哪类作风？","options":["只听老经验、不学新知识、拒绝新方法","只依赖老设备、老流程、老客户","年龄越大，所有判断越准确","做人诚实、表达真实、办事务实"],"answer":3,"explanation":"“三老”强调诚实与务实，不是按年龄或资历决定对错。这里用释义帮助理解，具体表述以公开文化材料为准。","tip":"“老实”指作风，不指年龄。","sourceIds":["S04"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E061","category":"企业文化","topic":"三基工作","difficulty":1,"stem":"石化企业常说的“三基”工作，主要包括？","options":["基层建设、基础工作、基本功训练","基层建设、基础设施、基本工资","基本技能、基础科研、基层服务","基层党建、基础投资、基本保障"],"answer":0,"explanation":"中国石化相关官方文章把“三基”列为基层建设、基础工作、基本功训练，强调组织、管理基础和技能。","tip":"组织基础、管理基础、技能基础。","sourceIds":["S07"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E062","category":"企业文化","topic":"HSE含义","difficulty":1,"stem":"石油石化行业管理语境中，HSE通常对应？","options":["健康、服务、环境","健康、安全、环境","健康、安全、效率","人力、安全、能源"],"answer":1,"explanation":"HSE分别对应Health、Safety、Environment。它不是单独的安全检查，也涵盖健康与环境。","tip":"H健康、S安全、E环境。","sourceIds":["S08"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E063","category":"企业文化","topic":"HSE理念","difficulty":1,"stem":"依据中国石化国勘公司公开HSE方针，下列哪个组合最符合其原则？","options":["效益第一、事后补救、忽略环境、只看产量","先抢进度、后补手续、风险自担、各自为政","以人为本、安全第一、预防为主、综合治理","只查事故、免做预防、忽视健康、减少培训"],"answer":2,"explanation":"该官方方针把人、安全、预防和综合管理放在一起。答题时应注意预防和全过程管理，而非出事后才处理。","tip":"预防优于被动补救。","sourceIds":["S09"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E064","category":"能源与海工","topic":"双碳目标","difficulty":2,"stem":"关于我国宣布的双碳目标，下列哪项表述准确？","options":["2030年前实现碳中和、2060年前碳达峰","二氧化碳排放力争2035年前达峰、努力争取2060年前碳中和","二氧化碳排放力争2030年前达峰、努力争取2050年前碳中和","二氧化碳排放力争2030年前达峰，努力争取2060年前实现碳中和"],"answer":3,"explanation":"目标包含“2030年前”和“2060年前”。碳中和并非停止一切能源使用，也不能与所有行业绝对零排放简单等同。","tip":"达峰2030年前，中和2060年前。","sourceIds":["S10"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E065","category":"能源与海工","topic":"能源安全战略","difficulty":2,"stem":"“四个革命、一个合作”中的“四个革命”指？","options":["能源消费、供给、技术、体制革命","能源消费、价格、技术、体制革命","能源消费、供给、人才、体制革命","能源消费、供给、技术、贸易革命"],"answer":0,"explanation":"国家能源局对该战略的说明明确列出消费、供给、技术、体制四个方面；另一个合作是加强国际合作。","tip":"消费—供给—技术—体制，另加国际合作。","sourceIds":["S11"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E066","category":"能源与海工","topic":"绿色氢能","difficulty":2,"stem":"下列哪一种制氢路径通常被称为“绿氢”路径？","options":["仅因氢气无色就把任何制氢都称为绿氢","利用风电或光伏等可再生电力电解水制氢","未经减排处理的煤制氢","仅给制氢设备涂绿色油漆"],"answer":1,"explanation":"绿氢的关键是可再生能源来源与制取路径，不能仅依据使用端产物判断全链条排放。项目评价仍要明确核算边界。","tip":"“绿”看来源和过程，不看颜色。","sourceIds":["S12"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E067","category":"能源与海工","topic":"CCUS概念","difficulty":2,"stem":"CCUS这一技术概念通常指？","options":["二氧化碳捕集与封存，不含利用概念","碳排放交易、结算与审计","二氧化碳捕集、利用与封存","碳核算、能源供应与储备"],"answer":2,"explanation":"CCUS包含捕集、利用和封存等环节，是减排技术路径之一；不能只看利用环节就忽略运输、封存与核算。","tip":"捕集—利用—封存。","sourceIds":["S13"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E068","category":"时政","topic":"核心价值观层次","difficulty":2,"stem":"社会主义核心价值观中，“爱国、敬业、诚信、友善”属于哪个层面的价值要求？","options":["国家层面","社会层面","仅企业利润层面","公民个人层面"],"answer":3,"explanation":"司法部公开解读将这四项归为公民层面。需区分国家、社会和公民三个层次。","tip":"公民：爱国、敬业、诚信、友善。","sourceIds":["S14"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E069","category":"时政","topic":"新发展理念","difficulty":2,"stem":"下列哪组属于新发展理念？","options":["创新、协调、绿色、开放、共享","扩张、封闭、粗放、短期、排他","规模、速度、数量、形式、热度","依赖、保守、浪费、垄断、独占"],"answer":0,"explanation":"新发展理念包含创新、协调、绿色、开放、共享五个方面。练习时应理解各维度联系，不把发展简单等同于数量扩张。","tip":"创新协调绿色开放共享。","sourceIds":["S14"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E070","category":"能源与海工","topic":"能源安全理解","difficulty":2,"stem":"国家能源局对“一个合作”的解释，最接近下列哪项？","options":["彻底停止所有能源国际合作","全方位加强国际合作，在开放条件下保障能源安全","只在本地生产一切能源产品","仅依靠单一海外供应来源"],"answer":1,"explanation":"该战略把国际合作与能源安全相联系。多元供应、能力建设和合作可以共同发挥作用，开放不等于依赖单一来源。","tip":"能源安全与国际合作可以相互促进。","sourceIds":["S11"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E071","category":"企业文化","topic":"企业愿景","difficulty":2,"stem":"以中国石化天津石化官网2026年7月发布的《中国石化企业文化》为依据，企业愿景是？","options":["建设世界领先现代化能源与化工公司","建设世界一流能源化工公司","打造世界领先洁净能源化工公司","建设成为人民满意、世界一流能源化工公司"],"answer":0,"explanation":"采用2026年官方页面的现行表述。网上旧资料仍可能出现早期愿景版本，复习时应标明来源与时间。","tip":"愿景有版本，优先看近期官方表述。","sourceIds":["S15"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E072","category":"企业文化","topic":"理念辨析","difficulty":1,"stem":"“为美好生活加油”与“严、细、实”在中国石化文化体系中分别属于？","options":["企业作风、企业使命","企业使命、企业作风","企业愿景、企业精神","核心价值观、企业愿景"],"answer":1,"explanation":"两者分别回答企业存在的目的和日常工作作风，不能把文化层级混为一谈。","tip":"使命讲目的，作风讲做事方式。","sourceIds":["S15"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E073","category":"企业文化","topic":"石油精神","difficulty":1,"stem":"中国石化公开文化材料概括的石油精神，核心关键词是？","options":["家国情怀、精细严谨、求真务实","担当、务实、智慧","苦干实干、三老四严","人本、责任、诚信"],"answer":2,"explanation":"官方文化材料用这些关键词概括石油精神，强调扎实劳动和严格诚实的作风。","tip":"石油精神与石化传统一并理解、分别记忆。","sourceIds":["S06"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E074","category":"企业文化","topic":"石化传统","difficulty":2,"stem":"下列哪组概括与中国石化公开资料中的石化传统相符？","options":["苦干实干、三老四严","担当、务实、智慧","严格要求、严密组织、严明纪律","家国情怀、精细严谨、求真务实"],"answer":3,"explanation":"这三个维度分别强调情怀、专业作风与事实导向，属于石化传统的概括。","tip":"情怀—严谨—务实。","sourceIds":["S06"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E075","category":"企业文化","topic":"人本内涵","difficulty":1,"stem":"中国石化“人本”价值观的内涵，最准确的是？","options":["重视员工主体作用和成长，把人的需要与企业发展结合","只考虑管理者便利","员工必须无条件放弃所有个人权益","用机器替代一切人员后就不需人才建设"],"answer":0,"explanation":"“人本”关注员工发展和人的需要，不是以单一群体便利替代共同发展。此题考公开理念的释义。","tip":"企业发展依靠人，也服务人的发展。","sourceIds":["S04"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E076","category":"企业文化","topic":"责任内涵","difficulty":1,"stem":"在中国石化公开核心价值理念中，“责任”首先强调的方向最接近？","options":["把所有决策责任推给个人","围绕主责主业承担国家和社会责任","只对当季收入负责","以企业利益为由忽视社会影响"],"answer":1,"explanation":"公开资料把责任与产业报国、能源安全等职责相联系；不能理解为只看短期财务结果。","tip":"责任贯通主业、国家与社会。","sourceIds":["S04"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E077","category":"企业文化","topic":"诚信内涵","difficulty":2,"stem":"“重信守诺、合规经营”最直接对应中国石化哪项核心价值观？","options":["创新","人本","诚信","精细"],"answer":2,"explanation":"此表述强调信用与合法合规经营，直接对应诚信；其他价值观虽相关但不是最直接归属。","tip":"诚信既讲信用，也讲合规。","sourceIds":["S05"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E078","category":"企业文化","topic":"精细内涵","difficulty":1,"stem":"中国石化“精细”价值观最强调哪一种工作追求？","options":["一切事项都无限增加审批层级","只做漂亮报表，不查实际过程","只要总体指标好就忽略细节","对经营管理和技术细节持续改进，提高质量与水平"],"answer":3,"explanation":"精细强调专业、严谨和改进，并不等于繁琐，更不是形式材料。","tip":"细致为了质量效率，不是为了繁琐。","sourceIds":["S05"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E079","category":"企业文化","topic":"创新内涵","difficulty":1,"stem":"依据中国石化公开文化资料，下列对“创新”的理解最准确的是？","options":["既包括科技创新，也包括管理、产品和业务等方面的创新","只允许实验室发现，不包括管理改善","只要与过去不同就必然更好","未经评估改变安全规程也属于应鼓励的创新"],"answer":0,"explanation":"创新有多种形式，应以改进与发展为目标，并与规范验证相协调。","tip":"创新范围广，效果要验证。","sourceIds":["S04"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E080","category":"企业文化","topic":"共赢内涵","difficulty":2,"stem":"中国石化“共赢”价值观强调的关系，最恰当的是？","options":["只有企业获利，其他利益主体无关","企业、员工、合作方等共同发展，并重视与自然的协调","所有合作都不需明确责任","以长期依赖单一伙伴替代市场竞争"],"answer":1,"explanation":"共赢强调互利和共同成长，不意味着没有规则、没有竞争或完全一致的利益。","tip":"共同发展，需要规则与责任。","sourceIds":["S04"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E081","category":"企业文化","topic":"四严","difficulty":1,"stem":"“三老四严”中的“四严”，下列哪组正确？","options":["严格的考核、严密的组织、严肃的态度、严明的纪律","严格的要求、严密的组织、严肃的态度、严谨的设计","要求严格、组织严密、态度严肃、纪律严明","严格的要求、严密的计划、严肃的态度、严明的纪律"],"answer":2,"explanation":"四严对应要求、组织、态度、纪律四个方面，不能与言语苛刻或压制意见混同。","tip":"要求—组织—态度—纪律。","sourceIds":["S04"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E082","category":"企业文化","topic":"作风内涵","difficulty":1,"stem":"中国石化“实”的作风最强调？","options":["用汇报次数替代实际成果","为了避免暴露问题只报喜","不分析情况照搬所有旧经验","依据事实办事，以实际成效检验工作"],"answer":3,"explanation":"“实”是求实和实干的统一，不是表面忙碌，也不是脱离情况套用经验。","tip":"察实情，求实效。","sourceIds":["S05"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E083","category":"企业文化","topic":"品牌口号","difficulty":2,"stem":"中国石化公开品牌资料中的品牌口号是？","options":["能源至净，生活至美","为美好生活加油","爱我中华、振兴石化","创新引领行业未来，责任创享美好生活"],"answer":0,"explanation":"此处考品牌口号，需与企业使命及品牌主张分别记忆。","tip":"品牌口号：能源至净，生活至美。","sourceIds":["S16"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E084","category":"企业文化","topic":"品牌主张","difficulty":1,"stem":"中国石化公开品牌主张最对应下列哪组关键词？","options":["能源至净，生活至美","创新引领行业未来，责任创享美好生活","担当、务实、智慧","人本、责任、诚信、精细、创新、共赢"],"answer":1,"explanation":"品牌主张将创新与责任相连，是对行业未来和生活价值的表达，不等于使命或愿景。","tip":"品牌主张抓住创新与责任。","sourceIds":["S16"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E085","category":"企业文化","topic":"品牌个性","difficulty":1,"stem":"中国石化公开品牌资料中的三项品牌个性是？","options":["严格、细致、务实","开放、合作、创新","担当、务实、智慧","责任、诚信、精细"],"answer":2,"explanation":"品牌个性属于品牌体系的概念，注意它与六项核心价值观的数量和内容不同。","tip":"品牌个性三项，核心价值观六项。","sourceIds":["S16"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E086","category":"企业文化","topic":"品牌标识","difficulty":2,"stem":"中国石化图形标中的英文简称是？","options":["CNPC","CNOOC","SASAC","SINOPEC"],"answer":3,"explanation":"SINOPEC为中国石化标识中的英文简称。CNPC与CNOOC分别对应其他石油企业集团，不能混用。","tip":"辨清中国石化、中国石油、中国海油。","sourceIds":["S16"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E087","category":"企业文化","topic":"标识构成","difficulty":1,"stem":"据中国石化官方品牌释义，图形标主要由哪三部分构成？","options":["朝阳图形、中文简称、英文简称","油滴图形、中文简称、英文简称","朝阳图形、中文全称、股票代码","地球图形、中文简称、英文简称"],"answer":0,"explanation":"标识由图形及中英文简称组成；题目只考公开品牌构成，不涉及颜色识别或商标鉴定。","tip":"朝阳＋中文＋英文。","sourceIds":["S16"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E088","category":"企业文化","topic":"易捷品牌","difficulty":1,"stem":"易捷在中国石化业务体系中的基础品牌定位，最接近？","options":["海上钻井平台型号","零售连锁便利店及综合服务品牌","单一润滑油牌号","油气田地震勘探软件"],"answer":1,"explanation":"中国石化北京石油官网将易捷介绍为零售连锁便利店品牌，并说明其向综合服务拓展。","tip":"易捷：便利零售与综合服务。","sourceIds":["S17"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E089","category":"企业文化","topic":"质量理念","difficulty":2,"stem":"中国石化南化官方文化资料中，质量理念“每一滴油都是承诺”重点体现什么？","options":["所有油品用途与指标完全相同","只要价格便宜就无需质量检验","对产品质量与顾客信任负责","质量只在宣传环节发挥作用"],"answer":2,"explanation":"这句理念强调质量承诺和信誉，并不是具体产品性能说明，不能由口号推出所有油品相同。","tip":"质量承诺不能替代具体技术标准。","sourceIds":["S06"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E090","category":"企业文化","topic":"核心职责","difficulty":1,"stem":"中国石化公开文化资料所述三大核心职责，不包括下列哪项？","options":["保障国家能源安全","引领我国石化工业高质量发展","担当国家战略科技力量","替代所有社会机构承担全部公共管理"],"answer":3,"explanation":"三大核心职责聚焦能源安全、产业高质量发展和战略科技力量，并非无边界承担所有公共管理。","tip":"三大核心职责：安全、产业、科技。","sourceIds":["S04"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E091","category":"企业文化","topic":"HSE目标","difficulty":1,"stem":"中国石化国勘公司公开QHSE方针中追求的目标组合是？","options":["零伤害、零污染、零事故","零伤害、零浪费、零事故","零风险、零污染、零成本","零违章、零排放、零故障"],"answer":0,"explanation":"该目标是管理追求，不是说生产活动天然不存在风险；仍需识别风险、培训和持续改进。","tip":"零目标需要全过程管理支撑。","sourceIds":["S09"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E092","category":"企业文化","topic":"安全文化","difficulty":2,"stem":"中国石化国勘公开管理理念如何看待HSE在经营中的地位？","options":["只有发生事故时才讨论","作为业务和项目全生命周期的重要前提，优先纳入管理","仅由安全部门负责，与其他岗位无关","只适用于生产现场，不涉及项目管理"],"answer":1,"explanation":"公开方针强调把HSE纳入业务和项目全生命周期。将其限制为事故后处置或单个部门任务不符合该理念。","tip":"HSE不是一个部门的孤立工作。","sourceIds":["S09"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E093","category":"企业文化","topic":"三基辨析","difficulty":1,"stem":"下列哪一项最直接对应“三基”中的基本功训练？","options":["仅调整部门名称","仅增加会议室面积","组织岗位技能练习、复盘和能力检验","仅修改宣传海报颜色"],"answer":2,"explanation":"基本功训练侧重岗位技能与实践能力。其他措施可能服务管理，但不直接等于技能训练。","tip":"基本功看能不能正确完成任务。","sourceIds":["S07"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E094","category":"企业文化","topic":"理念层次","difficulty":1,"stem":"“建设世界领先现代化能源与化工公司”主要回答什么问题？","options":["某次作业具体怎样操作","某位员工本月领取多少工资","某种产品应按哪项指标检验","企业希望建设成为什么样的组织"],"answer":3,"explanation":"愿景描述长期发展方向，不能代替具体岗位规程、薪酬政策或产品标准。","tip":"愿景讲未来方向。","sourceIds":["S15"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E095","category":"企业文化","topic":"官方口径","difficulty":2,"stem":"复习时发现下属企业特色精神与集团企业精神不同，合理做法是？","options":["分别标注适用主体和来源，不把下属企业特色表述直接替代集团口径","任选较长的一条作为集团标准答案","认为只要来自任一子公司就能代表所有单位","把两条拼接成一个从未发布的新口号"],"answer":0,"explanation":"企业文化存在集团与所属企业层级。官方页面也应结合标题和主体阅读，避免混用。","tip":"记口号也要记适用主体。","sourceIds":["S15","S18"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E096","category":"企业文化","topic":"价值观关系","difficulty":1,"stem":"“人本、责任、诚信、精细、创新、共赢”的准确概念归属是？","options":["企业愿景","企业核心价值观","企业品牌个性","单次项目施工步骤"],"answer":1,"explanation":"六项价值观是共同遵循的价值准则，愿景、品牌个性和业务操作分别属于不同层次。","tip":"六项价值观讲共同判断准则。","sourceIds":["S05"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E097","category":"企业文化","topic":"文化与行动","difficulty":1,"stem":"依据中国石化核心价值理念，下列哪种概括最合理？","options":["只要记熟口号就等于完成文化建设","文化只能用于宣传，不能影响管理","文化理念需要落实为员工成长、诚信经营、精细管理、创新合作等实际行动","文化要求可以替代具体制度和技术标准"],"answer":2,"explanation":"公开资料把核心理念与经营管理、员工行为联系起来。理念需要落地，但不能替代具体有效规范。","tip":"理念指导行动，制度明确操作要求。","sourceIds":["S04"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E098","category":"能源与海工","topic":"FPSO","difficulty":1,"stem":"海洋油气工程中的FPSO通常指？","options":["固定式陆上炼油塔","浮式生产储卸油装置","潜水员个人呼吸器","海底地震数据格式"],"answer":1,"explanation":"FPSO用于浮式生产、储存和外输等功能，不能与单纯运输油船或固定平台概念等同。此为岗位方向补充，不是已确认的统考范围。","tip":"岗位方向补充；先保证统一初选核心训练。","sourceIds":["S19"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E099","category":"能源与海工","topic":"动力定位","difficulty":1,"stem":"船舶动力定位系统保持位置和艏向的基本方式是？","options":["只靠船体重量，无需控制","只显示卫星坐标，不作用于推进器","利用测量反馈与控制器调节推进器推力和方向","必须将船体永久焊接到海底"],"answer":2,"explanation":"动力定位利用状态测量、控制计算和推力执行抵抗外部扰动；它不等于简单卫星定位显示。此为岗位方向补充。","tip":"岗位方向补充；先保证统一初选核心训练。","sourceIds":["S20"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E100","category":"能源与海工","topic":"环境载荷","difficulty":1,"stem":"海洋工程浮体分析中，“风浪流”通常指哪三类环境作用？","options":["风格、浪费、流程","温度、盐度、照度","风速、风向、风压三种风参数","风、波浪、海流"],"answer":3,"explanation":"海洋工程研究常联合考虑风、波浪与海流，并评价运动及系泊响应；不能把多种环境作用缩减为单一风作用。此为基础概念补充。","tip":"岗位方向补充；先保证统一初选核心训练。","sourceIds":["S21"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E101","category":"能源与海工","topic":"平台类型","difficulty":1,"stem":"以下哪项属于典型的固定式海洋平台结构概念？","options":["导管架平台","自由漂航油轮","普通救生艇","无人机"],"answer":0,"explanation":"海洋石油工程官方技术资料把大型固定式平台和导管架设计作为相关技术板块，与FPSO、半潜浮式平台区别列示。此为基础分类题。","tip":"岗位方向补充；先保证统一初选核心训练。","sourceIds":["S22"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"E102","category":"能源与海工","topic":"动力定位组成","difficulty":1,"stem":"中国船级社公开资料将动力定位系统概括为哪三个分系统？","options":["餐饮系统、住宿系统、娱乐系统","动力系统、推力器系统、动力定位控制系统","宣传系统、销售系统、结算系统","仅一个卫星接收器，无其他系统"],"answer":1,"explanation":"动力提供能量、推力器执行力与力矩、控制系统根据测量计算指令，三者共同作用。仅有位置测量不能自动保持位置。","tip":"岗位方向补充；先保证统一初选核心训练。","sourceIds":["S23"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T001","category":"时政","topic":"2025二十届四中全会","difficulty":1,"stem":"2025年10月，党的二十届四中全会审议通过的规划类文件是：","options":["关于制定国民经济和社会发展“十五五”规划的建议","关于制定“十三五”规划的建议","2026年政府工作报告","关于制定“十四五”规划的建议"],"answer":0,"explanation":"四中全会通过的是“十五五”规划建议；政府工作报告属于另一类文件。注意“建议”与后来依法审查批准的“纲要”不是同一文件。","tip":"先记会议与文件对应关系。","sourceIds":["T-src-01"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T002","category":"时政","topic":"十五五指导思想","difficulty":1,"stem":"“十五五”规划建议明确，以什么为经济社会发展的主题？","options":["满足美好生活需要","推动高质量发展","改革创新","扩大有效投资"],"answer":1,"explanation":"建议把高质量发展列为主题，强调质量提升与合理数量增长相统一，不能简化为只追速度或规模。","tip":"主题：高质量发展；勿与根本动力等位置混淆。","sourceIds":["T-src-01"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T003","category":"时政","topic":"现代化产业体系","difficulty":1,"stem":"“十五五”规划建议提出，发展经济的着力点应放在：","options":["土地出让收入","短期资本流动","实体经济","金融资产规模"],"answer":2,"explanation":"规划建议强调壮大实体经济，并以先进制造业为骨干建设现代化产业体系；也要求传统产业升级，并非一概退出。","tip":"实体经济是产业体系的根基。","sourceIds":["T-src-01"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T004","category":"时政","topic":"2026政府工作报告","difficulty":1,"stem":"2026年政府工作报告提出的经济增长预期目标是：","options":["5%左右","5.5%左右","3%左右","4.5%—5%，并在实际工作中努力争取更好结果"],"answer":3,"explanation":"2026年的区间目标为4.5%—5%。这是预期目标，不能写成已经实现的全年增速。","tip":"数字题连同年份和“预期”属性一起记。","sourceIds":["T-src-02"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T005","category":"时政","topic":"2026就业目标","difficulty":1,"stem":"2026年政府工作报告提出，城镇新增就业的预期目标是：","options":["1200万人以上","1000万人以上","1100万人以上","1300万人以上"],"answer":0,"explanation":"报告提出城镇新增就业1200万人以上。不要把新增就业人数与失业率等不同指标混淆。","tip":"新增就业看人数，调查失业率看比例。","sourceIds":["T-src-02"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T006","category":"时政","topic":"2026绿色发展目标","difficulty":2,"stem":"2026年政府工作报告提出，单位国内生产总值二氧化碳排放的年度预期变化是：","options":["降低4.5%左右","降低3.8%左右","降低3.5%左右","降低2.5%左右"],"answer":1,"explanation":"目标是单位GDP二氧化碳排放降低3.8%左右，属于排放强度指标，不等于全国排放总量直接下降同一比例。","tip":"强度＝排放量÷产出；强度与总量分开。","sourceIds":["T-src-02"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T007","category":"时政","topic":"2026宏观政策","difficulty":1,"stem":"2025年12月中央经济工作会议部署2026年经济工作时，提出继续实施的财政、货币政策组合是：","options":["稳健的财政政策和适度宽松的货币政策","更加积极的财政政策和从紧的货币政策","更加积极的财政政策和适度宽松的货币政策","积极的财政政策和稳健的货币政策"],"answer":2,"explanation":"会议部署的组合是更加积极财政、适度宽松货币。题干会议年份为2025，所部署工作年份为2026。","tip":"区分开会年与部署年。","sourceIds":["T-src-03"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T008","category":"时政","topic":"2026经济重点任务","difficulty":1,"stem":"2025年中央经济工作会议列出的2026年首项重点任务是：","options":["坚持创新驱动，加紧培育壮大新动能","坚持改革攻坚，增强高质量发展动力活力","坚持“双碳”引领，推动全面绿色转型","坚持内需主导，建设强大国内市场"],"answer":3,"explanation":"首项重点任务指向内需和强大国内市场。扩大内需不等于排斥对外开放，也不是只关注单一行业。","tip":"首项任务：内需主导、强大国内市场。","sourceIds":["T-src-03"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T009","category":"时政","topic":"投资于人","difficulty":2,"stem":"2025年中央经济工作会议提出投资于物与投资于人紧密结合。下列理解最符合其含义的是：","options":["既改善设施设备，也重视人的能力和民生需求","只修建设施，人才培养可一律取消","只发口号，不需任何实际投入","投资于人意味着停止全部基础设施建设"],"answer":0,"explanation":"会议强调两类投资结合。题目中的概括性场景旨在理解“结合”，不是把两者对立或取消任何一方。","tip":"看到“紧密结合”，排除非此即彼。","sourceIds":["T-src-03"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T010","category":"时政","topic":"人工智能+目标","difficulty":1,"stem":"2025年发布的“人工智能+”行动意见提出，到2027年，新一代智能终端、智能体等应用普及率目标是：","options":["超过30%","超过70%","超过90%","超过50%"],"answer":1,"explanation":"意见将2027年目标设为超过70%，2030年目标为超过90%。这些是规划目标，不能当作当前普及率。","tip":"2027超70%；2030超90%。","sourceIds":["T-src-04"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T011","category":"时政","topic":"人工智能+重点领域","difficulty":1,"stem":"“人工智能+”行动意见聚焦的重点领域，概括起来包括科技、产业、消费、民生、治理和：","options":["投融资管理","市场准入","全球合作","基础设施建设"],"answer":2,"explanation":"意见列出六大领域，最后一类是全球合作。该行动并不限于生产车间，也涉及消费、公共服务与治理。","tip":"按六类领域记忆，避免把具体支撑措施当成领域名称。","sourceIds":["T-src-04"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T012","category":"时政","topic":"人工智能安全治理","difficulty":2,"stem":"依据2025年“人工智能+”行动意见，下列做法最符合安全治理要求的是：","options":["认定模型输出永远真实，无需核实","为追求速度取消所有风险评估","将所有个人数据无条件公开","评估并防范模型幻觉和算法歧视等风险"],"answer":3,"explanation":"意见要求加强安全能力，防范黑箱、幻觉、歧视等问题。应用人工智能与管理其风险应同时推进。","tip":"AI发展与安全治理并行。","sourceIds":["T-src-04"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T013","category":"时政","topic":"2026中央一号文件","difficulty":1,"stem":"2026年中央一号文件题名中的主题表述是：","options":["锚定农业农村现代化，扎实推进乡村全面振兴","进一步深化农村改革，扎实推进乡村全面振兴","学习运用“千万工程”经验，有力有效推进乡村全面振兴","全面推进乡村振兴，加快建设农业强国"],"answer":0,"explanation":"2026年文件题名突出农业农村现代化和乡村全面振兴。其余选项虽也涉及“三农”，但不是2026年文件题名中的这处表述。","tip":"一号文件：农业、农村、农民；年度题名勿混淆。","sourceIds":["T-src-05"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T014","category":"时政","topic":"乡村振兴工作方法","difficulty":1,"stem":"2026年中央一号文件提出，以学习运用哪项经验为引领？","options":["“晋江经验”","“千万工程”经验","“浦江经验”","“枫桥经验”"],"answer":1,"explanation":"文件强调学习运用“千万工程”经验。其他经验名称也常见于政策学习，但不是本题所问文件的这处表述。","tip":"“千万工程”是乡村振兴的重要经验来源。","sourceIds":["T-src-05"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T015","category":"时政","topic":"航天科技2025","difficulty":1,"stem":"2025年发射的天问二号，其主要任务目标包括：","options":["执行月球背面采样返回任务","承担空间站载人运输任务","对小行星进行探测、采样返回，随后开展主带彗星探测","一次完成火星环绕、着陆和巡视探测"],"answer":2,"explanation":"国家航天局公布的任务设计包括小行星2016HO3探测取样返回及随后对311P主带彗星的探测。发射成功不等于全部任务已经完成。","tip":"天问二号：小行星采样返回＋彗星探测。","sourceIds":["T-src-06"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T016","category":"时政","topic":"航天发射","difficulty":1,"stem":"天问二号于2025年5月29日从哪个发射中心成功发射？","options":["酒泉卫星发射中心","太原卫星发射中心","文昌航天发射场","西昌卫星发射中心"],"answer":3,"explanation":"国家航天局发布的发射地点为西昌，所用火箭为长征三号乙。不要按其他任务的常见地点套用。","tip":"将任务、时间与地点成组记忆。","sourceIds":["T-src-06"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T017","category":"时政","topic":"民营经济促进法","difficulty":1,"stem":"《中华人民共和国民营经济促进法》开始施行的日期是：","options":["2025年5月20日","2025年4月30日","2025年1月1日","2026年1月1日"],"answer":0,"explanation":"法律于2025年4月30日通过并公布，自5月20日起施行；通过日和施行日不同。","tip":"法律日期题先区分通过、公布、施行。","sourceIds":["T-src-07"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T018","category":"时政","topic":"公平竞争原则","difficulty":1,"stem":"依据民营经济促进法，民营经济组织与其他各类经济组织在法律地位、市场机会、发展权利上应当：","options":["不受任何法律保护","平等","由企业所在地区任意决定是否平等","只允许少数指定企业享有"],"answer":1,"explanation":"法律确立平等地位和机会等原则，并非根据所有制或地域任意区别对待；平等保护也不意味着免除依法经营义务。","tip":"公平竞争与依法经营相统一。","sourceIds":["T-src-07"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T019","category":"时政","topic":"2026可再生能源规划","difficulty":1,"stem":"《可再生能源发展“十五五”规划》提出的发展主线是：","options":["先停全部传统能源，再考虑替代","只追求规模而取消安全约束","扩量提质、可靠替代","只扩装机，不管实际利用"],"answer":2,"explanation":"2026年官方解读将扩量提质、可靠替代作为主线，规模增长还要兼顾效率、质量和稳定供能能力。","tip":"装机规模、发电量、可靠供能是不同维度。","sourceIds":["T-src-08"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T020","category":"时政","topic":"可靠替代","difficulty":2,"stem":"在2026年可再生能源规划解读中，“可靠替代”强调的推进原则是：","options":["无条件立即拆除全部传统能源设施","只要装机增加就无需电网调节","不必考虑高峰时段供能保障","先立后破、破立并举，增强安全可靠替代能力"],"answer":3,"explanation":"官方解读强调先建立可靠能力再推进替代，还要增强容量支撑与系统调节能力，不能把转型理解成突然切断保障。","tip":"能源转型要兼顾安全与低碳。","sourceIds":["T-src-08"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T021","category":"时政","topic":"2030能源目标","difficulty":1,"stem":"2026年公布的新型能源体系建设“十五五”规划提出，到2030年，非化石能源消费比重目标为：","options":["25%","20%","30%","50%"],"answer":0,"explanation":"规划目标为25%。这是非化石能源占能源消费的比重，不是风光装机占比，也不是2026年已经实现值。","tip":"核对年份、指标名称与分母。","sourceIds":["T-src-09"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T022","category":"时政","topic":"新型能源体系","difficulty":1,"stem":"新型能源体系建设“十五五”规划强调加快建设何种能源体系？","options":["只增加消耗、不考虑技术进步","清洁低碳、安全高效","高污染、低效率、无储备","完全依赖单一进口通道"],"answer":1,"explanation":"规划将清洁低碳与安全高效一体考虑，既要求转型，也要求可靠供应和效率提升。","tip":"“绿色”和“安全”同时记。","sourceIds":["T-src-09"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T023","category":"时政","topic":"能源法施行","difficulty":1,"stem":"《中华人民共和国能源法》自哪一天起施行？","options":["2025年6月1日","2026年1月1日","2025年1月1日","2024年11月8日"],"answer":2,"explanation":"能源法于2024年11月8日通过，自2025年1月1日起施行。发布网页时间也不等于施行时间。","tip":"能源法：2025年元旦施行。","sourceIds":["T-src-10"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T024","category":"时政","topic":"非化石能源","difficulty":2,"stem":"根据能源法对能源类别的定义，下列说法正确的是：","options":["核能与煤炭都属于可再生能源","非化石能源只包括风能","天然气不属于化石能源","非化石能源包括可再生能源和核能"],"answer":3,"explanation":"能源法区分可再生能源与非化石能源：后者包括可再生能源和核能。核能不是因为属于非化石能源就自动成为可再生能源。","tip":"非化石能源范围大于可再生能源。","sourceIds":["T-src-10"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T025","category":"时政","topic":"2025碳市场扩围","difficulty":1,"stem":"2025年全国碳排放权交易市场首次扩围，新纳入的三类行业是：","options":["钢铁、水泥、铝冶炼","交通运输、建筑、农业","石油化工、造纸、航空","煤炭、纺织、制药"],"answer":0,"explanation":"生态环境部公布的首次扩围范围为钢铁、水泥、铝冶炼。应按正式文件行业名称记忆，不自行扩大到所有工业行业。","tip":"首次扩围三行业：钢铁、水泥、铝冶炼。","sourceIds":["T-src-11"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T026","category":"时政","topic":"碳市场作用","difficulty":2,"stem":"生态环境部2025年扩围解读所阐述的碳市场作用，最适合概括为：","options":["以交易代替全部排放数据质量管理","利用市场机制形成减排激励与约束","让重点排放单位不再需要核算排放","宣布所有企业立即实现零排放"],"answer":1,"explanation":"碳市场把排放核算、配额和交易机制结合起来，引导减排选择。市场交易不能代替可靠数据，也不意味着排放已经清零。","tip":"碳交易需要准确核算作为基础。","sourceIds":["T-src-11"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T027","category":"时政","topic":"2026生态环境法典","difficulty":1,"stem":"《中华人民共和国生态环境法典》已于2026年3月12日通过，其施行日期是：","options":["2026年1月1日","2026年6月5日","2026年8月15日","2026年3月12日"],"answer":2,"explanation":"主席令第70号明确自2026年8月15日起施行，司法部转载的8月15日新华社消息再次确认正式施行。不能把通过日当施行日。","tip":"生态环境法典：2026年全国生态日起施行。","sourceIds":["T-src-12","T-src-19"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T028","category":"时政","topic":"生态法典结构","difficulty":1,"stem":"2026年施行的生态环境法典，除总则、污染防治、生态保护、法律责任和附则外，单独设有哪一编？","options":["能源安全","气候变化","自然资源利用","绿色低碳发展"],"answer":3,"explanation":"法典共五编，其中绿色低碳发展独立成编；题干中的“法律责任和附则”合为一编。其余选项不属于该法典编名。","tip":"记五编时，法律责任和附则算一编。","sourceIds":["T-src-12"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T029","category":"时政","topic":"二十届三中全会","difficulty":1,"stem":"二十届三中全会提出，进一步全面深化改革的总目标是：","options":["继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化","只调整单个行业价格","用一项短期活动替代制度建设","将公共治理排除在改革范围之外"],"answer":0,"explanation":"2024年三中全会决定明确这一总目标，指向制度与治理现代化；不能缩小为单一行业或临时活动。","tip":"三中全会重点：进一步全面深化改革。","sourceIds":["T-src-13"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T030","category":"时政","topic":"改革任务时间表","difficulty":1,"stem":"二十届三中全会决定提出，到哪一年完成该决定提出的改革任务？","options":["2035年","2029年","2027年","2030年"],"answer":1,"explanation":"决定将任务完成节点明确为2029年，即中华人民共和国成立80周年。2035年是另一层次的长远目标节点。","tip":"2029改革任务；2035基本实现现代化，勿串年。","sourceIds":["T-src-13"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T031","category":"时政","topic":"新质生产力","difficulty":1,"stem":"关于新质生产力，下列理解正确的是：","options":["只要项目名称新就一定属于新质生产力","与劳动者技能、技术创新完全无关","创新起主导作用，强调高科技、高效能、高质量","仅仅把原有设备数量翻倍"],"answer":2,"explanation":"新质生产力强调创新驱动及效率、质量跃升，不能用简单数量扩张或“新名词”代替实质判断。","tip":"“新”重创新，“质”重质量与效能。","sourceIds":["T-src-14"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T032","category":"时政","topic":"因地制宜发展","difficulty":2,"stem":"依据有关新质生产力的重要论述，对传统产业最恰当的做法是：","options":["不分地区条件一律全部放弃","只要是传统产业就禁止创新","所有地区只发展同一种新兴产业","结合资源和产业基础，用新技术改造提升"],"answer":3,"explanation":"相关论述强调结合资源禀赋、产业基础和科研条件，有选择地发展新动能，同时改造提升传统产业。发展新质生产力不等于抛弃传统产业。","tip":"因地制宜，避免一哄而上。","sourceIds":["T-src-14"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T033","category":"时政","topic":"2025生态文明","difficulty":1,"stem":"2025年是“绿水青山就是金山银山”理念提出多少周年？","options":["20周年","10周年","25周年","30周年"],"answer":0,"explanation":"这一理念于2005年提出，2025年为20周年。题目问的是2025年的纪念节点，不是当前年份与2005的差值。","tip":"周年题先看题干指定年份。","sourceIds":["T-src-15"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T034","category":"时政","topic":"发展与保护","difficulty":2,"stem":"“绿水青山就是金山银山”理念所揭示的发展与保护关系，最恰当的是：","options":["只要经济规模大就可以忽略生态质量","可通过绿色发展实现协同共生","经济发展必然要求破坏生态","生态保护意味着完全停止发展"],"answer":1,"explanation":"官方阐述强调发展和保护不是必然对立，而可协同促进。既不能以破坏换增长，也不能把保护理解为停止所有发展。","tip":"核心是协同，避免两种绝对化理解。","sourceIds":["T-src-15"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T035","category":"时政","topic":"全国统一大市场","difficulty":2,"stem":"下列哪项最符合全国统一大市场建设要求？","options":["以企业注册地决定是否允许公平投标","对同类经营主体任意设置不同准入门槛","清理地方保护和区域壁垒，促进公平准入","地方自行禁止外地合格企业参与竞争"],"answer":2,"explanation":"2025年公开的指引强调禁止地方保护、区域壁垒及妨碍公平准入等做法。统一市场不是把所有企业经营方式强制做成一样。","tip":"统一规则与公平竞争，不等于经营模式一致。","sourceIds":["T-src-16"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T036","category":"时政","topic":"2025政策发布","difficulty":1,"stem":"国家发展改革委向社会全文公开《全国统一大市场建设指引（试行）》是在：","options":["2024年12月","2025年3月","2026年1月","2025年1月"],"answer":3,"explanation":"官方发布会记录显示，全文公开发生在2025年1月7日。指引成文于2024年12月4日，本题问的是向社会公开时间。","tip":"成文日期与公开日期要分清。","sourceIds":["T-src-16"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T037","category":"时政","topic":"二十大基础理论","difficulty":1,"stem":"党的二十大报告明确，全面建设社会主义现代化国家的首要任务是：","options":["高质量发展","全面深化改革","高水平对外开放","扩大内需"],"answer":0,"explanation":"二十大报告将高质量发展确定为首要任务，强调发展的质量与效益，不能简化为短期数量扩张。","tip":"基础理论与近期政策可以连起来记。","sourceIds":["T-src-17"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T038","category":"时政","topic":"教育科技人才","difficulty":1,"stem":"党的二十大报告指出，全面建设社会主义现代化国家的基础性、战略性支撑是：","options":["资源、区位、人口","教育、科技、人才","产业、资本、市场","投资、消费、出口"],"answer":1,"explanation":"报告把教育、科技、人才作为基础性、战略性支撑，强调三者协同；这不是2026年才首次提出的概念。","tip":"教育、科技、人才一体理解。","sourceIds":["T-src-17"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T039","category":"时政","topic":"双碳目标","difficulty":1,"stem":"我国碳达峰、碳中和目标的时间节点分别是：","options":["2035年前、2060年前","2030年前、2050年前","2030年前、2060年前","2025年前、2050年前"],"answer":2,"explanation":"相关政策明确力争2030年前碳达峰、2060年前碳中和。达峰是排放达到峰值后的转向，不能与净排放中和混为一谈。","tip":"先达峰，后中和。","sourceIds":["T-src-18"],"provenance":"据公开资料编写","priority":"补充","examSection":"补充知识"},{"id":"T040","category":"时政","topic":"双碳政策重点","difficulty":1,"stem":"做好碳达峰碳中和工作的政策意见，把哪一方面作为关键？","options":["无限扩大高耗能低效项目","完全停止科技创新","只做宣传而不调整能源利用方式","能源绿色低碳发展"],"answer":3,"explanation":"政策将经济社会全面绿色转型作为引领，将能源绿色低碳发展作为关键。实际推进还需统筹发展与减排，不能仅停留在宣传。","tip":"能源是双碳转型的关键领域。", function normalize(raw){const s=DEFAULT();if(!raw||typeof raw!=='object')return s;s.large=raw.large===true;s.favorites=Array.isArray(raw.favorites)?[...new Set(raw.favorites.filter(x=>BYID[x]))]:[];if(raw.records&&typeof raw.records==='object'){for(const [id,r] of Object.entries(raw.records)){if(BYID[id]&&r&&Number.isFinite(r.attempts)&&r.attempts>=0)s.records[id]={attempts:Math.min(r.attempts,1e6),correct:Math.max(0,Math.min(Number(r.correct)||0,r.attempts)),lastCorrect:r.lastCorrect===true,at:typeof r.at==='string'?r.at:''};}}s.history=Array.isArray(raw.history)?raw.history.slice(-50).filter(x=>x&&typeof x.label==='string'&&Number.isFinite(x.total)&&Number.isFinite(x.correct)):[];const a=raw.session;if(a&&Array.isArray(a.ids)&&a.ids.length>0&&a.ids.length<=1000&&new Set(a.ids).size===a.ids.length&&a.ids.every(id=>BYID[id])&&['practice','exam'].includes(a.mode)&&Number.isFinite(a.index)&&Number.isFinite(a.startedAt)&&(a.mode!=='exam'||Number.isFinite(a.endsAt))){s.session={...a,index:Math.max(0,Math.min(a.ids.length-1,Math.trunc(a.index))),answers:{},revealed:{},finished:a.finished===true,label:String(a.label||'练习')};for(const id of a.ids){if(Array.isArray(a.answers?.[id])&&a.answers[id].every(i=>Number.isInteger(i)&&i>=0&&i<4))s.session.answers[id]=[...new Set(a.answers[id])];if(a.revealed?.[id]===true)s.session.revealed[id]=true;}}return s;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageAvailable=false;toast('当前浏览器不能保存记录，请及时导出备份。');}}

function home(){const s=stats();return `<section class="hero"><div><div class="eyebrow">SINOPEC · STUDY COMPANION</div><h1>把握节奏，<br>把会做的题拿稳。</h1><p>${BANK.length} 道分类练习，配逐题解析。先做一组找到薄弱点，再用错题复习巩固。</p><div class="row">${button('开始 20 题速练 →','quick','primary')}${button('计时模拟','mock')}</div></div><div class="hero-art"><div class="eyebrow">你的统考时间 · 已按截图核对</div><div class="date">11 / 08</div><div><strong>2026 年 · 15:00—17:00</strong><div class="small muted">2027年度毕业生招聘统一初选考试</div></div></div></section><div class="stats"><div class="stat"><strong>${s.done}<small class="tiny"> / ${BANK.length}</small></strong><span>已练题目</span></div><div class="stat"><strong>${s.accuracy}</strong><span>累计作答正确率</span></div><div class="stat"><strong>${s.wrong}</strong><span>待巩固错题</span></div><div class="stat"><strong>${state.favorites.length}</strong><span>收藏题目</span></div></div>${state.session&&!state.session.finished?`<div class="panel row spread"><div><strong>继续上次的${state.session.mode==='exam'?'模拟':'练习'}</strong><div class="small muted">${esc(state.session.label)} · 第 ${state.session.index+1} / ${state.session.ids.length} 题${state.session.mode==='exam'?' · 计时持续进行':''}</div></div>${button('继续 →','resume','primary')}</div>`:''}<div class="section-head"><h2>按模块练习</h2><span class="small muted">从薄弱处开始</span></div><div class="grid">${CATEGORIES.map((cat,i)=>{const qs=BANK.filter(q=>q.category===cat),done=qs.filter(q=>state.records[q.id]).length;return `<button class="card" data-action="category" data-category="${cat}"><div class="module-top"><span class="module-num">0${i+1} / ${['企业文化','时政','能源与海工'].includes(cat)?'SUPPLEMENT':'PRACTICE'}</span><span class="module-arrow">↗</span></div><h3>${cat}</h3><p class="small muted">${CATEGORY_DESC[cat]}</p><div class="progress"><i style="width:${qs.length?done/qs.length*100:0}%"></i></div><div class="small muted">${done} / ${qs.length} 题已练</div></button>`;}).join('')}</div><div class="section-head"><h2>考前，把时间花在这里</h2><a class="text-btn" href="#guide">查看速记 →</a></div><div class="panel"><div class="list-row"><div><strong>01 · 一组诊断</strong><div class="small muted">20 题速练，找出最容易丢分的环节</div></div><span class="tag">约 25 分钟</span></div><div class="list-row"><div><strong>02 · 思想素质 + 错题</strong><div class="small muted">读清情境，以安全、诚信、责任和协作为判断依据</div></div><span class="tag">约 40 分钟</span></div><div class="list-row"><div><strong>03 · 公式与考场节奏</strong><div class="small muted">回看增长率、比例与逻辑条件；按准考证核对入场要求</div></div><span class="tag">约 20 分钟</span></div></div><div class="notice">这是个人复习题库，题目为原创模拟或据公开资料编写，并非官方真题或完整考试题库。练习分类用于训练相关能力，不代表官方题型、题量或命题预测。企业文化、时政、能源与海工为专项补充，不承诺属于官方独立命题模块。</div>`;}
function practice(){return `<div class="eyebrow">FOCUSED PRACTICE</div><h1>这一组，练什么？</h1><p class="subheading">按模块、难度或薄弱点选择。提交后立即看解析。</p><div class="panel"><div class="filters"><div class="field"><label for="category">练习模块</label><select id="category">${['全部',...CATEGORIES].map(x=>`<option ${x===filterCategory?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="level">难度</label><select id="level"><option value="all">全部难度</option><option value="1">基础</option><option value="2">进阶</option><option value="3">挑战</option></select></div><div class="field"><label for="scope">题目范围</label><select id="scope"><option value="all">全部题目</option><option value="unseen">尚未练过</option><option value="wrong">我的错题</option><option value="favorite">我的收藏</option></select></div><div class="field"><label for="count">本组题数</label><select id="count"><option value="20">20 题</option><option value="10">10 题</option><option value="30">30 题</option><option value="50">50 题</option><option value="999">全部匹配题</option></select></div></div><div class="field" style="margin-top:16px"><label for="search">搜索考点、题干或解析</label><input id="search" placeholder="例如：增长率、加强、诚信" maxlength="100"></div><div class="row spread" style="margin-top:22px"><label class="checkline"><input id="random" type="checkbox" checked>随机出题</label><span class="small muted" id="matched"></span></div><div style="margin-top:20px">${button('开始这一组 →','start-filter','primary full')}</div></div><div class="notice">所有练习题均提供参考答案。思想素质情境题的解析是练习判断依据，不代表官方题目评分规则。多选题需选择全部正确项，训练中不计部分分。</div>`;}
function filterQuestions(){return BANK.filter(q=>($('category').value==='全部'||q.category===$('category').value)&&($('level').value==='all'||q.difficulty===Number($('level').value))&&($('scope').value==='all'||($('scope').value==='unseen'&&!state.records[q.id])||($('scope').value==='wrong'&&state.records[q.id]&&!state.records[q.id].lastCorrect)||($('scope').value==='favorite'&&state.favorites.includes(q.id)))&&(!($('search').value.trim())||[q.stem,q.topic,q.explanation,q.material,...q.options].join(' ').includes($('search').value.trim())));}

function newSession(qs,label,mode='practice',minutes=0){if(!qs.length){toast('没有匹配题目，试试其他筛选条件。');return;}if(state.session&&!state.session.finished&&!confirm('开始新一组会替换尚未结束的练习；已经提交的练习记录会保留。继续吗？'))return;state.session={ids:qs.map(q=>q.id),index:0,answers:{},revealed:{},mode,label,startedAt:Date.now(),endsAt:minutes?Date.now()+minutes*60000:null,finished:false};save();navigate('session');}
function sampleBalanced(n){const counts=n===100?{'思想素质':40,'言语理解':12,'逻辑判断':12,'数量关系':12,'资料分析':12,'图形规律':12}:{'思想素质':20,'言语理解':6,'逻辑判断':6,'数量关系':6,'资料分析':6,'图形规律':6};return Object.entries(counts).flatMap(([cat,c])=>shuffle(BANK.filter(q=>q.category===cat)).slice(0,c));}

function sessionView(){const s=state.session;if(!s)return `<div class="empty">还没有进行中的练习。<br><a href="#practice">去选一组题</a></div>`;if(s.finished)return resultView();const q=BYID[s.ids[s.index]],chosen=s.answers[q.id]||[],show=s.revealed[q.id]&&s.mode!=='exam',correct=ans(q),isCorrect=equal(chosen,correct);return `<div class="question-head"><a href="#home" class="text-btn">← 暂存返回</a>${s.mode==='exam'?'<span class="timer" id="timer"></span>':`<span class="small muted">即时解析模式</span>`}</div><div class="row spread"><div><strong>${esc(s.label)}</strong><div class="small muted">第 ${s.index+1} / ${s.ids.length} 题 · 已${s.mode==='exam'?'作答':'提交'} ${Object.keys(s.mode==='exam'?s.answers:s.revealed).length} 题</div></div>${button(state.favorites.includes(q.id)?'★ 已收藏':'☆ 收藏','favorite','compact',`data-id="${q.id}"`)}</div><div class="progress"><i style="width:${(s.index+1)/s.ids.length*100}%"></i></div><section class="panel"><div class="row"><span class="tag red">${esc(q.category)}</span><span class="tag">${esc(q.topic)}</span><span class="tag">${difficulty(q)} · ${ans(q).length>1?'多选':'单选'}</span></div>${q.material?`<div class="material" style="margin-top:20px">${esc(q.material)}</div>`:''}<div class="question-stem">${esc(q.stem)}</div>${q.visual?`<div class="visual">${safeSVG(q.visual)}</div>`:''}<div class="options">${q.options.map((o,i)=>`<button class="option ${chosen.includes(i)?'selected':''} ${show&&correct.includes(i)?'correct':''} ${show&&chosen.includes(i)&&!correct.includes(i)?'wrong':''}" data-action="option" data-index="${i}" aria-pressed="${chosen.includes(i)}" ${show?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${show?`<div class="explanation"><h3>${isCorrect?'✓ 回答正确':'再看一遍思路'} · 参考答案 ${letters(correct)}</h3>${esc(q.explanation)}${q.tip?`<div class="tip"><strong>记住这一点</strong><br>${esc(q.tip)}</div>`:''}<div class="tiny muted" style="margin-top:12px">${esc(q.provenance)} · ${esc(q.id)}${questionSources(q)}</div></div>`:s.mode==='practice'?button('提交并看解析','check','primary full',chosen.length?'':'disabled'):`<p class="small muted">选择后自动保存，交卷后查看解析。${correct.length>1?'本题为多选，须选择全部正确项。':''}</p>`}<div class="question-actions">${button('← 上一题','prev','',s.index===0?'disabled':'')}${s.index<s.ids.length-1?button('下一题 →','next',show?'primary':''):button(s.mode==='exam'?'交卷':'完成本组','finish','primary')}</div></section><details><summary>答题卡 · ${s.ids.length} 题</summary><div><div class="q-grid">${s.ids.map((id,i)=>`<button class="q-number ${s.index===i?'current':''} ${(s.mode==='exam'?s.answers[id]?.length:s.revealed[id])?'done':''}" data-action="jump" data-index="${i}" aria-label="跳到第${i+1}题">${i+1}</button>`).join('')}</div><div class="small muted">绿色表示已${s.mode==='exam'?'作答':'提交'}；可点题号跳转。</div></div></details><div class="row spread"><span class="small muted">未提交的练习题不计入记录。</span>${button(s.mode==='exam'?'提前交卷':'结束本组','finish','compact')}</div>`;}

 ['思想素质：按情境判断','先辨问题：是否涉及人员安全、数据真实、利益冲突、保密或职责？再辨行动：立即控制风险、如实记录、依法依规报告、协作解决并复盘。\n责任不是包办一切；协作不是隐瞒问题；坚持不是无视风险；服从安排不等于接受明显违规指令。具体行动须结合紧急程度、权限和制度。\n情境题参考答案是本工具编写的练习判断，不代表官方评分规则。'],
 ['言语理解：主旨与细节','主旨题：先找主题，再看转折、结论及因果；覆盖全文而非一个例子。\n细节题：逐项定位，警惕“部分→全部”“可能→必然”“相关→因果”“过去→现在”。\n排序衔接：看指代、时间顺序、总分结构、转折和因果。\n逻辑填空：先看词义和搭配，再看上下文态度与递进程度。'],
 ['逻辑判断：条件与论证','“如果P，那么Q”：P→Q；可推非Q→非P，不能倒成Q→P。\n“只有P，才Q”：Q→P。\n并非所有A都是B：至少有一个A不是B。并非有些A是B：没有A是B。\n加强/削弱先识别结论和证据；优先检查因果、代表性、对照条件及遗漏因素。\n排列题把条件列清，用最强约束先定位，不凭感觉逐个选。'],
 ['数量关系：常用关系','工程：工作量=效率×时间；合作效率相加。\n行程：路程=速度×时间；相向速度相加，同向追及用速度差。等路程往返平均速度=2uv/(u+v)，不是(u+v)/2。\n利润率=利润/成本；销售利润率=利润/售价；先问清分母。\n概率（等可能）：有利结果数/全部结果数；无放回抽取每次分母改变。\n排列看顺序，组合不看顺序：C(n,k)=n!/[k!(n−k)!]。\n两集合容斥：至少属于一个=A+B−同时属于两者。\n先排不合理数量级，再精算；所有换算要带单位。'],
 ['资料分析：公式速查','增长量=现期−基期；增长率=(现期−基期)/基期。\n基期=现期/(1+r)；增长量=现期×r/(1+r)。\n连续两期增长：总增长率=(1+r₁)(1+r₂)−1。先涨20%再降20%，最终是原来的96%。\n比重=部分/整体；比重从20%到25%是上升5个百分点，相对增长25%。\n平均数=总量/数量；两个组的总体平均要按数量加权。\n若部分和整体增长率分别为a、b：现期比重>基期比重当且仅当a>b（基数及现期均为正）。\n同比与上年同期比，环比与紧邻上一期比。亿元、万元、千吨、百分数要分开核对。'],
 ['图形规律：观察顺序','先看元素数量、封闭区域、线段或交点，再看旋转、平移、镜像、叠加与填充变化。\n同一组优先选简单且能解释全部已知图形的规律。矩阵题分别看行和列，避免只凭最后两个图形猜测。\n图形练习只是训练观察与空间推理，不代表官方必考某种图形题。'],
 ['职业性格：如实且一致','按你通常的真实行为回答，区分“我实际经常这样做”和“我觉得理想员工应当这样做”。遵守题目要求，不研究伪装成某种固定人设的答案模板。\n遇到相似题按相同事实标准判断；不为追求所谓高分而刻意制造完美形象。题库不对职业性格设置标准正确答案，不模拟官方人格测评评分。'],
 ['海洋工程岗位：补充放在后面','你的岗位是上海海洋油气分公司海洋工程研究岗。当前已确认参加统一初选考试，截图未说明另加专业笔试。\n企业文化、海洋油气与工程基础用于背景复习；本工具把它们放在补充模块，并不认定其属于这次统考的确定命题范围。专业研究、项目经历和具体技术问题更适合后续按单位测试面试通知准备。']
];
function readable(v){if(v==null)return '';if(typeof v==='string'||typeof v==='number')return `<p class="long-copy">${esc(v)}</p>`;if(Array.isArray(v))return v.map(readable).join('');if(typeof v==='object'){const labels={body:'要点',content:'要点',summary:'要点',date:'日期',period:'时间范围',note:'提示',publishedDate:'发布日期',event:'主题',facts:'速记',why:'理解',memory:'记忆提示'};return `${v.title?`<h3>${esc(v.title)}</h3>`:''}${Object.entries(v).filter(([k])=>!['title','sourceIds','id','url','sourceId'].includes(k)).map(([k,x])=>`<div>${['items','points','steps'].includes(k)?'':labels[k]?`<strong>${labels[k]}</strong>`:''}${readable(x)}</div>`).join('')}${v.sourceIds?questionSources(v):''}`;}return '';}
function safeURL(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:'#';}catch{return '#';}}
function questionSources(q){return (q.sourceIds||[]).map(id=>{const src=DATA.sources.find(s=>s.id===id);return src?`<div style="margin-top:8px"><a href="${attr(safeURL(src.url))}" target="_blank" rel="noopener noreferrer">核对来源：${esc(src.title)}</a></div>`:'';}).join('');}
function guide(){return `<div class="eyebrow">LAST-MILE NOTES</div><h1>考前速记，不盲目加量。</h1><p class="subheading">核验日期：2026-11-07 · 时间以你的准考证为准</p><div class="panel"><div class="wrap-table"><table class="guide-table"><tr><th>公开公告维度</th><th>复习重点</th><th>分值口径</th></tr><tr><td>思想素质</td><td>价值观、责任感、意志品质</td><td>40分</td></tr><tr><td>思维能力</td><td>系统、辩证、多元、创新、敏捷思维</td><td>60分</td></tr><tr><td>职业性格</td><td>真实、稳定地描述日常行为</td><td>不计入总分</td></tr></table></div><p class="tiny muted" style="margin:12px 0 0">分值与维度依据公开公告转载。原招聘站动态正文直接读取受限。详细证据见下方来源。</p></div>${STUDY.map(([title,body],i)=>`<details ${i===0?'open':''}><summary>${String(i+1).padStart(2,'0')} · ${title}</summary><div class="long-copy">${esc(body)}</div></details>`).join('')}${DATA.currentGuide?.length?`<details open><summary>时政重点速记 · 截至2026-11-07</summary><div>${readable(DATA.currentGuide)}</div></details>`:''}${DATA.research?.cheatsheet?`<details><summary>公开资料补充要点</summary><div>${readable(DATA.research.cheatsheet)}</div></details>`:''}<div class="section-head"><h2>核验来源</h2><span class="tag">可点开核对</span></div><div class="panel">${(DATA.sources||[]).map(s=>`<div class="source-item"><div class="row"><span class="tag">${esc(s.evidenceLevel||'公开资料')}</span><span class="tiny muted">${esc(s.id)}</span></div><a href="${attr(safeURL(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a><div class="small muted">${esc(s.publisher||'')} · ${esc(s.accessed||'2026-11-07')}</div><div class="small">${esc(s.note||'')}</div></div>`).join('')}<div class="source-item"><strong>用户提供的准考证与应聘进展截图</strong><div class="small muted">用于确认考试名称、时间及岗位，未将原图或个人账号信息发布到网页。</div></div></div><div class="notice">未发现足以确认“所有可能试题”的官方公开题库。此工具提供有边界的能力训练，无法保证押中原题。若公告、准考证与转载有差异，以官方通知和准考证为准。</div>`;}
function settings(){return `<div class="eyebrow">YOUR STUDY DESK</div><h1>记录在手边。</h1><div class="panel"><h2>显示与保存</h2><label class="checkline"><input type="checkbox" id="large-font" ${state.large?'checked':''}>增大题目字号</label><p class="small muted" style="margin-top:16px">错题、收藏和练习进度保存在当前浏览器。不同手机、浏览器或网址之间不会自动同步；清理浏览器数据可能清除记录。可导出备份，再到另一设备导入。</p><div class="row">${button('导出学习记录','export','primary')}<label class="btn" for="import-file">导入记录</label><input type="file" id="import-file" accept="application/json,.json" hidden style="display:none"></div>${!storageAvailable?'<div class="notice">当前环境不能持久保存，请使用导出备份。</div>':''}</div><div class="panel"><h2>离线与手机使用</h2><p class="small">在线地址可用手机浏览器打开并收藏。也可下载单文件版，在支持本地HTML的浏览器中打开，不需要联网。</p><a class="btn" href="./中石化刷题-离线版.html" download>下载离线刷题版</a><p class="small muted" style="margin:12px 0 0">微信或文件管理器的预览可能禁用脚本；此时选择“用浏览器打开”，或使用在线地址。iOS本地HTML支持因打开方式而异，建议优先使用在线版。浏览器保存失败时页面会提示。</p></div><div class="panel"><h2>题库说明</h2><p class="small">当前 ${BANK.length} 题，内容版本 ${esc(DATA.version)}。全部为原创模拟或据公开资料编写，配参考答案和解析，不是官方授权题库。计时模拟题量与判分为训练设置；职业性格不提供标准答案。</p><a href="#guide" class="text-btn">查看范围与核验来源 →</a><div class="divider"></div>${button('清空本设备学习记录','reset','compact')}</div>`;}
function focusPanel(){return `<div class="panel focus-panel"><div class="eyebrow">YOUR FOCUS · 优先补强</div><h2>企业文化 & 时政</h2><p class="small muted">两个独立题库，都在这个网页。按主题逐题学，也可以混合练习。题目附资料来源，错题统一保存。</p><div class="row">${button('企业文化','category','primary','data-category="企业文化"')}${button('时政专练','category','primary','data-category="时政"')}${button('混合练 30 题 →','focus','')}</div></div>`;}
function render(){const route=(location.hash.slice(1)||'home').split('?')[0];document.body.classList.toggle('large',state.large);let html=({home,practice,review,guide,settings,session:sessionView,mock:mockSetup}[route]||home)();if(route==='home')html=html.replace('<div class="stats">',focusPanel()+'<div class="stats">');$('app').innerHTML=html;document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===(route==='session'||route==='mock'?'practice':route)));updateMatch();tick();}
function tick(){const s=state.session;if(!s||s.finished||s.mode!=='exam')return;const remain=Math.max(0,Math.ceil((s.endsAt-Date.now())/1000));if($('timer'))$('timer').textContent=`${Math.floor(remain/60).toString().padStart(2,'0')}:${(remain%60).toString().padStart(2,'0')}`;if(!remain)finish(true);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const s=state.session,action=b.dataset.action;if(s&&!s.finished&&s.mode==='exam'&&Date.now()>=s.endsAt){finish(true);return;}
 if(action==='quick'){let qs=shuffle(BANK.filter(q=>q.priority!=='补充'&&!state.records[q.id]));if(qs.length<20)qs=shuffle(BANK.filter(q=>q.priority!=='补充'));newSession(qs.slice(0,20),'20题速练');}
 else if(action==='category'){filterCategory=b.dataset.category;navigate('practice');}
 else if(action==='focus'){newSession(shuffle(BANK.filter(q=>['企业文化','时政'].includes(q.category))).slice(0,30),'企业文化与时政专练');}
 else if(action==='mock')navigate('mock');
 else if(action==='start-mock'){const n=Number($('mock-length').value);newSession(sampleBalanced(n),`${n}题计时训练`,'exam',n===100?120:60);}
 else if(action==='start-filter'){let qs=filterQuestions();if($('random').checked)qs=shuffle(qs);newSession(qs.slice(0,Number($('count').value)),$('category').value==='全部'?'综合练习':$('category').value);}
 else if(action==='resume')navigate('session');
 else if(action==='favorite'){const id=b.dataset.id;if(state.favorites.includes(id))state.favorites=state.favorites.filter(x=>x!==id);else state.favorites.push(id);save();b.innerHTML=state.favorites.includes(id)?'★ 已收藏':'☆ 收藏';}
 else if(action==='option'&&s&&!s.finished){const q=BYID[s.ids[s.index]];if(s.revealed[q.id])return;const n=Number(b.dataset.index),a=s.answers[q.id]||[];s.answers[q.id]=ans(q).length>1?(a.includes(n)?a.filter(x=>x!==n):[...a,n]):[n];if(!s.answers[q.id].length)delete s.answers[q.id];save();render();}
 else if(action==='check'&&s){const q=BYID[s.ids[s.index]];if(!s.answers[q.id]?.length||s.revealed[q.id])return;grade(q,s.answers[q.id]);s.revealed[q.id]=true;save();render();}
 else if(['prev','next','jump'].includes(action)&&s){s.index=action==='jump'?Number(b.dataset.index):s.index+(action==='next'?1:-1);s.index=Math.max(0,Math.min(s.ids.length-1,s.index));save();render();window.scrollTo(0,0);}
 else if(action==='finish')finish();
 else if(action==='retry-session'&&s){const qs=s.ids.filter(id=>s.revealed[id]&&!equal(s.answers[id],ans(BYID[id]))).map(id=>BYID[id]);newSession(qs,'本组错题复习');}
 else if(action==='review-tab'){reviewTab=b.dataset.tab;render();}
 else if(action==='review-start'||action==='review-category'){let ids=reviewTab==='wrong'?wrongIds():state.favorites;if(action==='review-category')ids=ids.filter(id=>BYID[id].category===b.dataset.category);newSession(shuffle(ids.map(id=>BYID[id])),reviewTab==='wrong'?'错题复习':'收藏复习');}
 else if(action==='export'){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='中石化学习记录-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 else if(action==='reset'&&confirm('确定清空当前浏览器的错题、收藏、练习进度和历史？此操作不会删除题库。建议先导出备份。')){state=DEFAULT();save();render();toast('学习记录已清空。');}
});
document.addEventListener('input',e=>{if(['category','level','scope','count','search'].includes(e.target.id))updateMatch();});
document.addEventListener('change',async e=>{if(e.target.id==='large-font'){state.large=e.target.checked;save();document.body.classList.toggle('large',state.large);}if(e.target.id==='import-file'){const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw new Error('备份文件过大');const raw=JSON.parse(await f.text());if(raw.version!==1||!raw.records||!Array.isArray(raw.favorites))throw new Error('不是有效学习记录');if(!confirm('导入将覆盖当前设备的学习记录。继续吗？'))return;state=normalize(raw);save();render();toast('学习记录已导入。');}catch(err){toast('导入失败：'+err.message);}}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
window.addEventListener('pagehide',save);window.addEventListener('pageshow',tick);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});setInterval(tick,1000);render();
</script></body></html>
