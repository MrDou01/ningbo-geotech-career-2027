-height:1;font-size:13px;margin-top:1px}.option.selected{border-color:var(--red);background:#fcf0ef}.option.selected .letter{background:var(--red);border-color:var(--red);color:white}.option.correct{border-color:#49a180;background:#eef8f1}.option.wrong{border-color:#c87872;background:#fff1ee}.option.correct .letter{color:var(--green);background:#e2f1e8;border-color:#b5d7c6}.explanation{background:#eff5ee;border:1px solid #dce6d8;border-radius:13px;padding:20px;white-space:pre-wrap;font-size:15px}.explanation h3{white-space:normal;color:var(--green)}.explanation .tip{margin-top:12px;border-top:1px solid #d6e1d2;padding-top:12px;font-size:13px}.question-actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px}.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;margin:14px 0}.q-number{min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}.q-number.done{background:#e4ecdf;border-color:#bcccaf}.q-number.current{outline:2px solid var(--red)}.q-number.bad{background:#f9dfdd;color:var(--red)}.q-number.good{background:#e1f0e5;color:var(--green)}details{border:1px solid var(--line);border-radius:13px;background:white;margin-bottom:12px;padding:0 18px}summary{cursor:pointer;padding:16px 0;font-weight:650}details>div{padding:0 0 18px;font-size:14px;line-height:1.85}details p{margin-bottom:10px}.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);display:flex;justify-content:space-around;width:min(100%,560px);padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(18px);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;z-index:10}.bottom-nav a{font-size:11px;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;width:20%;gap:1px;padding:3px}.bottom-nav a span{font-size:21px;height:29px;font-weight:700}.bottom-nav a.active{color:var(--red);font-weight:750}.source-item{padding:14px 0;border-bottom:1px solid var(--line);word-break:break-word}.source-item:last-child{border-bottom:0}.source-item a{color:var(--red)}#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);max-width:90%;padding:11px 20px;border-radius:12px;background:#252728;color:white;font-size:14px;z-index:50;display:none}.empty{text-align:center;padding:40px 16px;color:var(--muted)}.score{font-size:64px;line-height:1.2;color:var(--red);font-weight:800;letter-spacing:-2px}.score small{font-size:20px;color:var(--muted);letter-spacing:0}.list-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);gap:10px}.list-row:last-child{border:0}.guide-table{width:100%;border-collapse:collapse;font-size:14px}.guide-table td,.guide-table th{border-bottom:1px solid var(--line);padding:11px 7px;text-align:left;vertical-align:top}.guide-table th{white-space:nowrap}.wrap-table{overflow:auto}.break{overflow-wrap:anywhere}.checkline{display:flex;align-items:center;gap:10px;font-size:14px}.full{width:100%}.divider{height:1px;background:var(--line);margin:20px 0}.long-copy{white-space:pre-wrap}.pill-list{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.pill-list .btn{border-radius:22px;font-size:13px}.result-question{font-size:14px;line-height:1.7}.urgent{color:var(--red)}body.large{font-size:18px}body.large .question-stem{font-size:22px}body.large .option{font-size:19px}@media(max-width:700px){.topbar{height:73px;padding:12px 20px}main{padding:18px 18px 112px}.hero{grid-template-columns:1fr;gap:20px;padding:16px 0 24px}h1{font-size:31px}.hero-art{min-height:0;padding:18px 21px;display:grid;grid-template-columns:1fr auto;gap:0 15px;align-items:center}.hero-art .date{grid-column:2;grid-row:1/4;font-size:34px;margin:0}.hero-art .small{font-size:12px}.hero-art .eyebrow{margin-bottom:2px}.hero p{margin-bottom:19px}.grid{grid-template-columns:repeat(2,1fr);gap:11px}.card{padding:16px;border-radius:15 <body><header class="topbar"><a href="#home" class="brand"><span class="brand-icon">练</span><span>中石化笔试<small>2027 · 随身练</small></span></a><span class="personal-label">个人备考工具</span></header><main id="app"></main><nav class="bottom-nav" aria-label="主要导航"><a href="#home" data-nav="home"><span>⌂</span>首页</a><a href="#practice" data-nav="practice"><span>▤</span>刷题</a><a href="#review" data-nav="review"><span>↻</span>复习</a><a href="#guide" data-nav="guide"><span>≡</span>速记</a><a href="#settings" data-nav="settings"><span>⚙</span>设置</a></nav><div id="toast" role="status" aria-live="polite"></div><script>const DATA={"version":"2026.11.07","updatedAt":"2026-11-07","questions":[{"id":"Q001","category":"数量关系","topic":"工程合作","difficulty":1,"stem":"一项工程，甲单独完成需12天，乙单独完成需18天。两人效率不变，从开工起合作，多少天完成？","options":["7.2天","6天","7.5天","15天"],"answer":0,"explanation":"把工程量设为36份，甲每天完成3份，乙每天完成2份；合作需36÷5＝7.2天。易错点：不能把两人的单独用时直接取平均。","tip":"工程量可设为单独用时的最小公倍数。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q002","category":"数量关系","topic":"反求效率","difficulty":1,"stem":"甲、乙合作6天完成一项工作，甲单独完成需10天。乙单独完成需多少天？","options":["12天","15天","16天","18天"],"answer":1,"explanation":"乙每天完成总量的1/6－1/10＝1/15，因此单独完成需15天。易错点：应相减的是效率，不是时间。","tip":"先把时间换成单位时间工作量。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q003","category":"数量关系","topic":"进排水","difficulty":1,"stem":"水池初始为空。进水管单独8小时注满，排水管单独12小时排空满池；进、排水流量恒定。同时打开两管，多少小时可注满？","options":["4小时","10小时","24小时","20小时"],"answer":2,"explanation":"净流入速度为1/8－1/12＝1/24池/小时，所以注满需24小时。易错点：排水效率应扣除。","tip":"同时进排时使用净流量。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q004","category":"数量关系","topic":"分阶段工程","difficulty":2,"stem":"6名工人按相同且恒定的效率完成一项工作需15天。6人先工作5天后，增加4名同效率工人。剩余工作还需多少天？","options":["5天","9天","10天","6天"],"answer":3,"explanation":"总工作量为6×15＝90人天，已完成6×5＝30人天，剩60人天。增加后共10人，还需60÷10＝6天。易错点：题目问剩余时间，不是总工期11天。","tip":"先算剩余工作量，再除以新人数。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q005","category":"数量关系","topic":"相向行程","difficulty":1,"stem":"甲、乙两车从相距300千米的两地同时相向出发，速度分别为60千米/小时、40千米/小时。多少小时后相遇？","options":["3小时","2小时","5小时","7.5小时"],"answer":0,"explanation":"相向运动的距离缩短速度是60＋40＝100千米/小时，300÷100＝3小时。易错点：相遇用速度和。","tip":"相遇：路程÷速度和。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q006","category":"数量关系","topic":"追及行程","difficulty":1,"stem":"甲、乙同向匀速行驶。甲在前方30千米，速度50千米/小时；乙在后方，速度60千米/小时。从此时算起，乙几小时后追上甲？","options":["0.5小时","3小时","2小时","6小时"],"answer":1,"explanation":"追赶时每小时缩短60－50＝10千米，30÷10＝3小时。易错点：不能用乙的速度60直接除距离差。","tip":"追及：初始间距÷速度差。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q007","category":"数量关系","topic":"平均速度","difficulty":2,"stem":"某车沿原路往返两地，去程速度40千米/小时，返程速度60千米/小时，中途不停留。全程平均速度是多少？","options":["45千米/小时","50千米/小时","48千米/小时","52千米/小时"],"answer":2,"explanation":"设单程120千米，则去程3小时、返程2小时；全程240千米÷5小时＝48千米/小时。易错点：等路程往返不能取速度的算术平均数。","tip":"平均速度＝总路程÷总时间。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q008","category":"数量关系","topic":"流水行船","difficulty":1,"stem":"一艘船在同一河段顺流速度为18千米/小时，逆流速度为12千米/小时。若船在静水中的速度和水流速度均不变，水流速度是多少？","options":["6千米/小时","12千米/小时","15千米/小时","3千米/小时"],"answer":3,"explanation":"顺流＝船速＋水速，逆流＝船速－水速。两式相减得2倍水速为6，所以水速为3。易错点：15是静水船速。","tip":"水速＝（顺流速度－逆流速度）÷2。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q009","category":"数量关系","topic":"折扣利润","difficulty":2,"stem":"一件商品成本80元，先按成本加价50%标价，再按标价打八折出售。以成本为分母的利润率是多少？","options":["20%","10%","25%","30%"],"answer":0,"explanation":"标价80×1.5＝120元，售价120×0.8＝96元，利润16元，利润率16÷80＝20%。易错点：折扣作用于标价，利润率分母是成本。","tip":"连续变化按倍率连乘。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q010","category":"数量关系","topic":"利润率与销售利润率","difficulty":2,"stem":"某批商品销售收入5400元，成本4500元。以销售收入为分母的销售利润率约为多少？","options":["15%","16.67%","20%","25%"],"answer":1,"explanation":"利润5400－4500＝900元；题目明确分母是销售收入，因此900÷5400＝16.67%。易错点：900÷4500＝20%是成本利润率。","tip":"看清利润率的分母。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q011","category":"数量关系","topic":"溶液混合","difficulty":2,"stem":"将300克浓度20%的盐水与100克浓度50%的盐水混合，不发生损耗。混合后浓度是多少？","options":["25%","30%","27.5%","35%"],"answer":2,"explanation":"盐总量300×20%＋100×50%＝110克，总溶液400克，浓度110÷400＝27.5%。易错点：两份溶液质量不同，不能直接平均浓度。","tip":"混合问题先守恒溶质质量。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q012","category":"数量关系","topic":"稀释","difficulty":1,"stem":"200克浓度30%的盐水中加入100克纯水，不发生损耗。所得盐水浓度是多少？","options":["10%","15%","25%","20%"],"answer":3,"explanation":"盐质量保持200×30%＝60克；加水后溶液总质量300克，60÷300＝20%。易错点：纯水只增加溶液质量。","tip":"加水前后溶质不变。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q013","category":"数量关系","topic":"二集合容斥","difficulty":2,"stem":"某单位80人，参加英语培训45人，参加计算机培训38人，两项都参加16人。两项都未参加的有多少人？","options":["13人","3人","16人","29人"],"answer":0,"explanation":"至少参加一项的有45＋38－16＝67人，两项都未参加80－67＝13人。易错点：交集被重复计算一次，应减去一次。","tip":"两集合并集＝甲＋乙－交集。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q014","category":"数量关系","topic":"三集合容斥","difficulty":3,"stem":"100人中，参加A、B、C培训的分别有60、50、40人；同时参加A和B、A和C、B和C的分别有30、20、25人（均含三项都参加者），三项都参加15人。三项都不参加的有多少人？","options":["5人","10人","15人","25人"],"answer":1,"explanation":"并集＝60＋50＋40－30－20－25＋15＝90人，所以都不参加100－90＝10人。易错点：两两交集均包含三项交集，最后要加回三项交集。","tip":"三集合容斥：单项和－两两交集和＋三项交集。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q015","category":"数量关系","topic":"比例分配","difficulty":1,"stem":"甲、乙两组人数之比为3∶5，共64人。乙组比甲组多多少人？","options":["8人","24人","16人","40人"],"answer":2,"explanation":"一份为64÷8＝8人；两组相差2份，因此相差16人。易错点：40人是乙组总人数。","tip":"先求一份，再求所问份数。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q016","category":"数量关系","topic":"年龄方程","difficulty":2,"stem":"父亲现在的年龄是儿子的3倍，10年后父亲年龄是儿子的2倍。儿子现在多少岁？","options":["5岁","15岁","20岁","10岁"],"answer":3,"explanation":"设儿子现年x岁，父亲3x岁；3x＋10＝2(x＋10)，解得x＝10。易错点：10年后两人的年龄都要增加10。","tip":"年龄差不变，倍数随时间改变。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q017","category":"数量关系","topic":"数列：差分","difficulty":1,"stem":"按“相邻差依次为连续奇数”的规律补全数列：3，8，15，24，35，（ ）。","options":["48","46","47","49"],"answer":0,"explanation":"相邻差为5、7、9、11，下一差为13，因此35＋13＝48。易错点：观察的是相邻差的规律。","tip":"一阶差不恒定时，再看差分。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q018","category":"数量关系","topic":"数列：等比","difficulty":1,"stem":"按固定倍数递推，数列2，6，18，54的下一项是什么？","options":["108","162","144","216"],"answer":1,"explanation":"每项都是前一项的3倍，54×3＝162。易错点：相邻差6、12等并非此序列实际差值。","tip":"优先检查相邻项比值。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q019","category":"数量关系","topic":"数列：阶乘","difficulty":1,"stem":"按依次乘2、3、4、5……的规律，1，2，6，24，120的下一项是什么？","options":["240","600","720","840"],"answer":2,"explanation":"依次乘2、3、4、5，下一步乘6，120×6＝720。易错点：乘数本身在递增。","tip":"相邻项倍数可构成新的数列。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q020","category":"数量关系","topic":"数列：递推","difficulty":1,"stem":"每一项均为前一项的2倍减1：4，7，13，25，49，（ ）。","options":["95","96","99","97"],"answer":3,"explanation":"规则为a(n＋1)＝2a(n)－1，所以49×2－1＝97。易错点：不能只把49翻倍。","tip":"验证一个递推式是否适用于所有已知相邻项。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q021","category":"数量关系","topic":"概率：不放回","difficulty":2,"stem":"袋中有3个红球、2个蓝球，球除颜色外相同。不放回随机取2个球，两个都是红球的概率是多少？","options":["3/10","1/5","2/5","9/25"],"answer":0,"explanation":"概率＝3/5×2/4＝3/10；也可用组合数C(3,2)/C(5,2)。易错点：不放回后总球数与红球数都减少。","tip":"分步计算时随抽取更新分母。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q022","category":"数量关系","topic":"概率：等可能样本","difficulty":2,"stem":"独立投掷两枚公平六面骰子，点数和等于7的概率是多少？","options":["1/12","1/6","5/36","7/36"],"answer":1,"explanation":"36种有序结果等可能，和为7的有(1,6)、(2,5)、(3,4)、(4,3)、(5,2)、(6,1)，共6种，概率6/36＝1/6。易错点：点数和2到12并不等可能。","tip":"列举等可能的基本结果。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q023","category":"数量关系","topic":"排列：不同职位","difficulty":1,"stem":"从5人中选出队长和副队长各1人，且不能由同一人兼任。有多少种选法？","options":["10种","15种","20种","25种"],"answer":2,"explanation":"队长有5种选择，副队长剩4种，5×4＝20。易错点：职位不同，需要区分顺序。","tip":"有角色区分用排列。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q024","category":"数量关系","topic":"组合：分类选择","difficulty":2,"stem":"从4名女员工、3名男员工中选出2名女员工和1名男员工组成小组，小组内不设职位。有多少种选法？","options":["12种","24种","36种","18种"],"answer":3,"explanation":"选女员工有C(4,2)＝6种，选男员工有3种，合计6×3＝18种。易错点：组内不区分顺序，不能用4×3选两名女生。","tip":"分类独立选择用乘法，组内无序用组合。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q025","category":"数量关系","topic":"排列：捆绑法","difficulty":2,"stem":"甲、乙、丙、丁4人排成一行，要求甲、乙相邻。共有多少种不同排法？","options":["12种","6种","8种","16种"],"answer":0,"explanation":"把甲乙看成一个整体，与丙丁形成3个对象，共3!＝6种；甲乙内部有2种顺序，所以12种。易错点：不能漏掉甲乙内部交换。","tip":"必须相邻先捆绑，再乘内部排列数。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q026","category":"数量关系","topic":"平均数","difficulty":1,"stem":"5人的平均分为72分，其中1人为80分。其余4人的平均分是多少？","options":["68分","70分","71分","74分"],"answer":1,"explanation":"总分5×72＝360，剩余4人总分360－80＝280，平均280÷4＝70。易错点：删去一人后人数也要减1。","tip":"平均数问题先还原总量。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q027","category":"数量关系","topic":"加权平均","difficulty":1,"stem":"采购原料两批：30千克每千克10元，20千克每千克15元。全部原料的平均采购单价是多少？","options":["11元/千克","12.5元/千克","12元/千克","13元/千克"],"answer":2,"explanation":"总费用30×10＋20×15＝600元，总量50千克，均价600÷50＝12。易错点：数量不等，不能直接平均两个单价。","tip":"均价＝总金额÷总数量。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q028","category":"数量关系","topic":"余数问题","difficulty":2,"stem":"一个正整数除以5余2，除以3余1。满足条件的最小正整数是多少？","options":["2","12","17","7"],"answer":3,"explanation":"除以5余2的正整数依次为2、7、12、17……，其中最小且除以3余1的是7。易错点：要同时满足两条件。","tip":"从较大模数的余数序列试起。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q029","category":"数量关系","topic":"效率与时间","difficulty":2,"stem":"完成固定工作量，效率提高20%，所需时间比原来约减少百分之几？","options":["16.67%","20%","25%","30%"],"answer":0,"explanation":"原效率设为1、新效率1.2，则新时间为原来的1/1.2＝5/6；减少1/6≈16.67%。易错点：效率增幅和时间降幅分母不同。","tip":"工作量一定时，效率与时间成反比。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q030","category":"数量关系","topic":"几何：平方关系","difficulty":2,"stem":"圆的半径增加20%，面积增加百分之几？","options":["20%","44%","40%","48%"],"answer":1,"explanation":"面积与半径平方成正比，新面积为原来的1.2²＝1.44倍，所以增加44%。易错点：面积的变化不是半径变化的两倍。","tip":"长度倍率平方后得到面积倍率。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q031","category":"数量关系","topic":"统筹：工序并行","difficulty":2,"stem":"工序A需4小时、B需6小时，两者可同时开始。工序C需3小时，必须等A、B全部结束后才能开始。资源充足且工序不可缩短，最短总工期是多少？","options":["7小时","10小时","9小时","13小时"],"answer":2,"explanation":"A、B并行时6小时后均完成，再做C需3小时，总工期6＋3＝9小时。易错点：可并行的工序不应全部相加。","tip":"有前后约束时找最长依赖路径。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q032","category":"数量关系","topic":"最优化：整数约束","difficulty":1,"stem":"运输30吨货物，每辆货车每趟最多载8吨，每辆车只安排一趟。至少需要多少辆车？","options":["3辆","3.75辆","5辆","4辆"],"answer":3,"explanation":"30÷8＝3.75，但车辆数必须为整数且运力不少于30吨，所以向上取整为4辆。易错点：不能四舍五入到不足运力的数量。","tip":"满足“至少”的整数资源题通常向上取整。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"Q033","category":"资料分析","topic":"增长率","difficulty":1,"stem":"根据资料A，2025年甲产品产量同比增长多少？","options":["20%","16.67%","25%","40%"],"answer":0,"explanation":"2025年比2024年增加120－100＝20万吨，同比增长20÷100＝20%。易错点：基期应是2024年。","tip":"增长率＝增长量÷基期量。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料A：某企业产量】\n年度　甲产品（万吨）　乙产品（万吨）\n2023　80　120\n2024　100　150\n2025　120　180\n表中数值均为该年度产量。"},{"id":"Q034","category":"资料分析","topic":"比重","difficulty":1,"stem":"根据资料A，2025年乙产品占两种产品总产量的比重为多少？","options":["40%","60%","50%","66.67%"],"answer":1,"explanation":"2025年总产量120＋180＝300万吨，乙产品比重180÷300＝60%。易错点：分母不是甲产品产量。","tip":"比重＝部分量÷整体量。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料A：某企业产量】\n年度　甲产品（万吨）　乙产品（万吨）\n2023　80　120\n2024　100　150\n2025　120　180\n表中数值均为该年度产量。"},{"id":"Q035","category":"资料分析","topic":"间隔增长率","difficulty":2,"stem":"根据资料A，2025年甲产品产量比2023年增长多少？","options":["40%","44%","50%","60%"],"answer":2,"explanation":"间隔增长率为(120－80)÷80＝50%。也可算1.25×1.2－1＝50%。易错点：相邻两年的增长率不能直接相加。","tip":"间隔增长可直接用两端数据。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料A：某企业产量】\n年度　甲产品（万吨）　乙产品（万吨）\n2023　80　120\n2024　100　150\n2025　120　180\n表中数值均为该年度产量。"},{"id":"Q036","category":"资料分析","topic":"增长量比较","difficulty":1,"stem":"根据资料A，2024年两种产品总产量较上年增加多少万吨？","options":["20万吨","30万吨","60万吨","50万吨"],"answer":3,"explanation":"2024年总产量250，2023年总产量200，增长量50万吨。易错点：题目问两种合计。","tip":"同一口径先求合计再比较。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料A：某企业产量】\n年度　甲产品（万吨）　乙产品（万吨）\n2023　80　120\n2024　100　150\n2025　120　180\n表中数值均为该年度产量。"},{"id":"Q037","category":"资料分析","topic":"合计利润","difficulty":1,"stem":"根据资料B，四项业务利润合计多少万元？","options":["500万元","400万元","480万元","520万元"],"answer":0,"explanation":"收入合计2000万元，成本合计1500万元，利润500万元。易错点：应汇总全部四项业务。","tip":"整体利润等于整体收入减整体成本。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料B：业务收入与成本】\n业务　收入（万元）　成本（万元）\nA　800　600\nB　600　420\nC　400　300\nD　200　180\n本题利润＝收入－成本，不考虑其他项目。"},{"id":"Q038","category":"资料分析","topic":"利润率比较","difficulty":2,"stem":"根据资料B，以收入为分母计算，各业务中销售利润率最高的是哪项？","options":["A业务","B业务","C业务","D业务"],"answer":1,"explanation":"A为200/800＝25%，B为180/600＝30%，C为100/400＝25%，D为20/200＝10%，所以B最高。易错点：利润绝对额最大不等于利润率最高。","tip":"比较比率时统一分母口径。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料B：业务收入与成本】\n业务　收入（万元）　成本（万元）\nA　800　600\nB　600　420\nC　400　300\nD　200　180\n本题利润＝收入－成本，不考虑其他项目。"},{"id":"Q039","category":"资料分析","topic":"利润占比","difficulty":1,"stem":"根据资料B，A业务利润占全部业务利润的比重是多少？","options":["25%","30%","40%","50%"],"answer":2,"explanation":"A利润200万元，全部利润500万元，比重200÷500＝40%。易错点：收入占比与利润占比是不同指标。","tip":"分子分母保持同一指标。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料B：业务收入与成本】\n业务　收入（万元）　成本（万元）\nA　800　600\nB　600　420\nC　400　300\nD　200　180\n本题利润＝收入－成本，不考虑其他项目。"},{"id":"Q040","category":"资料分析","topic":"整体利润率","difficulty":2,"stem":"根据资料B，全部业务以收入为分母的销售利润率是多少？","options":["22.5%","27.5%","30%","25%"],"answer":3,"explanation":"全部利润500万元，全部收入2000万元，500÷2000＝25%。易错点：不能把四项业务利润率简单平均为22.5%。","tip":"整体比率用总分子除以总分母。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料B：业务收入与成本】\n业务　收入（万元）　成本（万元）\nA　800　600\nB　600　420\nC　400　300\nD　200　180\n本题利润＝收入－成本，不考虑其他项目。"},{"id":"Q041","category":"资料分析","topic":"全年合计","difficulty":1,"stem":"根据资料C，全年发电量是多少万千瓦时？","options":["600","450","550","650"],"answer":0,"explanation":"全年为120＋150＋180＋150＝600万千瓦时。易错点：这些是单季值，可以直接相加。","tip":"先区分单期值与累计值。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料C：发电量】\n季度　发电量（万千瓦时）\n第一季度　120\n第二季度　150\n第三季度　180\n第四季度　150\n表中各季度均为单季值。"},{"id":"Q042","category":"资料分析","topic":"环比下降率","difficulty":2,"stem":"根据资料C，第四季度发电量较第三季度约下降多少？","options":["20%","16.67%","25%","30%"],"answer":1,"explanation":"下降量180－150＝30，下降率30÷180≈16.67%。易错点：下降率分母是第三季度的180。","tip":"环比以紧邻前一期为基期。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料C：发电量】\n季度　发电量（万千瓦时）\n第一季度　120\n第二季度　150\n第三季度　180\n第四季度　150\n表中各季度均为单季值。"},{"id":"Q043","category":"资料分析","topic":"季度平均","difficulty":1,"stem":"根据资料C，下半年平均每季度发电量为多少万千瓦时？","options":["150","160","165","170"],"answer":2,"explanation":"下半年包括第三、第四季度，平均(180＋150)÷2＝165。易错点：下半年不是后三个季度。","tip":"确认统计期包含的期数。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料C：发电量】\n季度　发电量（万千瓦时）\n第一季度　120\n第二季度　150\n第三季度　180\n第四季度　150\n表中各季度均为单季值。"},{"id":"Q044","category":"资料分析","topic":"比重差","difficulty":2,"stem":"根据资料C，第三季度发电量占全年的比重，比第一季度高多少个百分点？","options":["8个百分点","15个百分点","50个百分点","10个百分点"],"answer":3,"explanation":"第三季度占180/600＝30%，第一季度占120/600＝20%，相差10个百分点。易错点：百分点是百分比直接相减。","tip":"比重差用百分点，不用百分比增幅。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料C：发电量】\n季度　发电量（万千瓦时）\n第一季度　120\n第二季度　150\n第三季度　180\n第四季度　150\n表中各季度均为单季值。"},{"id":"Q045","category":"资料分析","topic":"总增长率","difficulty":2,"stem":"根据资料D，2025年全部客户数同比增长约多少？","options":["33.33%","25%","30%","40%"],"answer":0,"explanation":"2024年共3000户，2025年共4000户，增加1000户，增长1000/3000≈33.33%。易错点：整体增长率不是四地区增速的简单平均。","tip":"汇总后计算整体增幅。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料D：客户数量】\n地区　2024年客户（户）　2025年客户（户）\n东部　1000　1200\n中部　800　1000\n西部　600　900\n北部　600　900"},{"id":"Q046","category":"资料分析","topic":"比重变化","difficulty":2,"stem":"根据资料D，东部客户占全部客户的比重，2025年比2024年约如何变化？","options":["提高3.33个百分点","下降3.33个百分点","下降10个百分点","保持不变"],"answer":1,"explanation":"东部2024年占1000/3000≈33.33%，2025年占1200/4000＝30%，下降约3.33个百分点。易错点：数量增长不代表比重提高。","tip":"部分增长慢于整体时，比重下降。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料D：客户数量】\n地区　2024年客户（户）　2025年客户（户）\n东部　1000　1200\n中部　800　1000\n西部　600　900\n北部　600　900"},{"id":"Q047","category":"资料分析","topic":"增长贡献率","difficulty":2,"stem":"根据资料D，西部客户增长量占全部客户增长量的比重是多少？","options":["22.5%","25%","30%","50%"],"answer":2,"explanation":"西部增长900－600＝300户，全体增长1000户，贡献占比300/1000＝30%。易错点：不是西部2025年客户量占比22.5%。","tip":"贡献率通常比较增长量。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料D：客户数量】\n地区　2024年客户（户）　2025年客户（户）\n东部　1000　1200\n中部　800　1000\n西部　600　900\n北部　600　900"},{"id":"Q048","category":"资料分析","topic":"增长率排序","difficulty":2,"stem":"根据资料D，2025年客户同比增长率最高的地区是哪一项？","options":["只有东部","只有中部","只有西部","西部和北部并列"],"answer":3,"explanation":"东部20%，中部25%，西部50%，北部50%，所以西部、北部并列最高。易错点：注意“并列”与“唯一”。","tip":"逐项计算，保留可能的并列结果。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料D：客户数量】\n地区　2024年客户（户）　2025年客户（户）\n东部　1000　1200\n中部　800　1000\n西部　600　900\n北部　600　900"},{"id":"Q049","category":"资料分析","topic":"单位量比较","difficulty":1,"stem":"根据资料E，单位产品能耗最低的是哪家工厂？","options":["乙厂","甲厂","丙厂","三厂相同"],"answer":0,"explanation":"甲10/50＝0.20，乙12/80＝0.15，丙25/100＝0.25吨标准煤/吨，乙最低。易错点：不能仅比较总能耗。","tip":"效率类指标先看分子分母。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料E：生产与能耗】\n工厂　产量（万吨）　能耗（万吨标准煤）\n甲　50　10\n乙　80　12\n丙　100　25\n单位产品能耗＝能耗÷产量。"},{"id":"Q050","category":"资料分析","topic":"综合平均","difficulty":2,"stem":"根据资料E，三厂合计单位产品能耗约为多少吨标准煤/吨？","options":["0.150","0.204","0.200","0.250"],"answer":1,"explanation":"总能耗47万吨标准煤，总产量230万吨，比值47/230≈0.204。易错点：三厂产量不等，不能简单平均三个单位能耗。","tip":"综合平均以产量为权重。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料E：生产与能耗】\n工厂　产量（万吨）　能耗（万吨标准煤）\n甲　50　10\n乙　80　12\n丙　100　25\n单位产品能耗＝能耗÷产量。"},{"id":"Q051","category":"资料分析","topic":"节约量","difficulty":2,"stem":"根据资料E，若丙厂保持产量不变，将单位产品能耗降至乙厂水平，则能耗可减少多少万吨标准煤？","options":["5","8","10","12"],"answer":2,"explanation":"乙单位能耗0.15，丙新能耗100×0.15＝15万吨标准煤，较原25减少10。易错点：需要按丙的产量计算目标能耗。","tip":"目标单位量×本厂规模＝目标总量。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料E：生产与能耗】\n工厂　产量（万吨）　能耗（万吨标准煤）\n甲　50　10\n乙　80　12\n丙　100　25\n单位产品能耗＝能耗÷产量。"},{"id":"Q052","category":"资料分析","topic":"相对差异","difficulty":2,"stem":"根据资料E，甲厂单位产品能耗比乙厂高约多少？","options":["25%","5%","50%","33.33%"],"answer":3,"explanation":"甲为0.20，乙为0.15，高出(0.20－0.15)/0.15≈33.33%。易错点：0.05是绝对差，不是5%的相对增幅。","tip":"“比乙高”以乙为分母。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料E：生产与能耗】\n工厂　产量（万吨）　能耗（万吨标准煤）\n甲　50　10\n乙　80　12\n丙　100　25\n单位产品能耗＝能耗÷产量。"},{"id":"Q053","category":"资料分析","topic":"累计转当月","difficulty":1,"stem":"根据资料F，3月当月销量是多少万件？","options":["60","50","90","150"],"answer":0,"explanation":"3月单月销量＝3月末累计150－2月末累计90＝60万件。易错点：150是累计值，不是3月单月值。","tip":"当期值＝本期累计－上期累计。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料F：月末累计销量】\n截至月份　当年累计销量（万件）\n1月末　40\n2月末　90\n3月末　150\n4月末　210\n5月末　280\n6月末　360\n累计口径：从当年1月1日起至对应月末。"},{"id":"Q054","category":"资料分析","topic":"季度销量","difficulty":2,"stem":"根据资料F，第二季度销量合计多少万件？","options":["150","210","200","360"],"answer":1,"explanation":"第二季度是4至6月，合计＝6月末累计360－3月末累计150＝210万件。易错点：不能把4、5、6月的累计值相加。","tip":"区间总量用累计终点减起点之前。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料F：月末累计销量】\n截至月份　当年累计销量（万件）\n1月末　40\n2月末　90\n3月末　150\n4月末　210\n5月末　280\n6月末　360\n累计口径：从当年1月1日起至对应月末。"},{"id":"Q055","category":"资料分析","topic":"单月环比","difficulty":3,"stem":"根据资料F，5月当月销量比4月当月销量约增长多少？","options":["12.5%","25%","16.67%","33.33%"],"answer":2,"explanation":"4月当月210－150＝60；5月当月280－210＝70。增长率(70－60)/60≈16.67%。易错点：应先把累计值还原为单月值。","tip":"累计表求环比，先作差再求增长。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料F：月末累计销量】\n截至月份　当年累计销量（万件）\n1月末　40\n2月末　90\n3月末　150\n4月末　210\n5月末　280\n6月末　360\n累计口径：从当年1月1日起至对应月末。"},{"id":"Q056","category":"资料分析","topic":"期间平均","difficulty":1,"stem":"根据资料F，上半年平均每月销量是多少万件？","options":["50","70","80","60"],"answer":3,"explanation":"上半年累计销量360万件，共6个月，平均360÷6＝60万件。易错点：累计序列的平均数不是月均销量。","tip":"月均值＝整个期间总量÷月数。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料F：月末累计销量】\n截至月份　当年累计销量（万件）\n1月末　40\n2月末　90\n3月末　150\n4月末　210\n5月末　280\n6月末　360\n累计口径：从当年1月1日起至对应月末。"},{"id":"Q057","category":"资料分析","topic":"单位换算","difficulty":2,"stem":"根据资料G，B产品平均出口单价是多少元/吨？","options":["3000元/吨","300元/吨","30000元/吨","300000元/吨"],"answer":0,"explanation":"9亿元÷30万吨＝0.3亿元/万吨；1亿元/万吨＝10000元/吨，所以单价3000元/吨。易错点：亿元与万吨同时换算。","tip":"先写清10的幂次，再相除。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料G：产品出口】\n产品　出口量（万吨）　出口额（亿元人民币）\nA　20　4\nB　30　9\nC　50　10\n平均出口单价＝出口额÷出口量。"},{"id":"Q058","category":"资料分析","topic":"总体单价","difficulty":2,"stem":"根据资料G，三种产品合计平均出口单价是多少元/吨？","options":["2000元/吨","2300元/吨","2333元/吨","2500元/吨"],"answer":1,"explanation":"总额23亿元，总量100万吨，23×10^8/(100×10^4)＝2300元/吨。易错点：不能把三种单价直接平均。","tip":"整体均价＝总额÷总量。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料G：产品出口】\n产品　出口量（万吨）　出口额（亿元人民币）\nA　20　4\nB　30　9\nC　50　10\n平均出口单价＝出口额÷出口量。"},{"id":"Q059","category":"资料分析","topic":"金额占比","difficulty":2,"stem":"根据资料G，C产品出口额占全部出口额约多少？","options":["40%","45%","43.48%","50%"],"answer":2,"explanation":"C出口额10亿元，全部23亿元，10/23≈43.48%。易错点：50%是C的出口量占比。","tip":"数量占比和金额占比不要混用。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料G：产品出口】\n产品　出口量（万吨）　出口额（亿元人民币）\nA　20　4\nB　30　9\nC　50　10\n平均出口单价＝出口额÷出口量。"},{"id":"Q060","category":"资料分析","topic":"量价乘积","difficulty":2,"stem":"根据资料G，若B产品下一年出口量增加10%，平均出口单价下降10%，则其出口额为多少亿元？","options":["8.1亿元","9亿元","9.9亿元","8.91亿元"],"answer":3,"explanation":"出口额＝量×价，新出口额9×1.10×0.90＝8.91亿元，较原来下降1%。易错点：等幅一增一减不互相抵消。","tip":"两因素变化用倍率相乘。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料G：产品出口】\n产品　出口量（万吨）　出口额（亿元人民币）\nA　20　4\nB　30　9\nC　50　10\n平均出口单价＝出口额÷出口量。"},{"id":"Q061","category":"资料分析","topic":"定基指数转同比","difficulty":2,"stem":"根据资料H，2025年产值比2024年增长多少？","options":["10%","11%","21%","31%"],"answer":0,"explanation":"2025年与2024年的产值比为121/110＝1.1，所以同比增长10%。易错点：121－110＝11是指数点差，不是同比增长11%。","tip":"同比增长率＝本期定基指数÷上期定基指数－1。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料H：产值指数与员工数】\n年度　产值指数（2023年＝100）　员工数（人）\n2023　100　1000\n2024　110　1100\n2025　121　1000\n各年产值指数采用同一价格口径。人均产值＝产值÷员工数。"},{"id":"Q062","category":"资料分析","topic":"人均量增长","difficulty":2,"stem":"根据资料H，2024年人均产值比2023年如何变化？","options":["增长10%","保持不变","下降10%","增长21%"],"answer":1,"explanation":"产值变为1.1倍，人数也变为1.1倍，人均量倍率1.1/1.1＝1，所以不变。易错点：总量增加不一定人均量增加。","tip":"人均增长倍率＝总量倍率÷人数倍率。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料H：产值指数与员工数】\n年度　产值指数（2023年＝100）　员工数（人）\n2023　100　1000\n2024　110　1100\n2025　121　1000\n各年产值指数采用同一价格口径。人均产值＝产值÷员工数。"},{"id":"Q063","category":"资料分析","topic":"人均量间隔增长","difficulty":2,"stem":"根据资料H，2025年人均产值比2023年增长多少？","options":["10%","11%","21%","33.1%"],"answer":2,"explanation":"两年员工数都为1000，人均变化与产值变化相同，121/100－1＝21%。易错点：基期是2023，不是2024。","tip":"分母相同时，直接比较分子。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料H：产值指数与员工数】\n年度　产值指数（2023年＝100）　员工数（人）\n2023　100　1000\n2024　110　1100\n2025　121　1000\n各年产值指数采用同一价格口径。人均产值＝产值÷员工数。"},{"id":"Q064","category":"资料分析","topic":"人数下降率","difficulty":1,"stem":"根据资料H，2025年员工数比2024年约下降多少？","options":["10%","11%","21%","9.09%"],"answer":3,"explanation":"减少1100－1000＝100人，下降率100/1100≈9.09%。易错点：分母应是2024年的1100。","tip":"下降率以较早期为分母。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","material":"【自编资料H：产值指数与员工数】\n年度　产值指数（2023年＝100）　员工数（人）\n2023　100　1000\n2024　110　1100\n2025　121　1000\n各年产值指数采用同一价格口径。人均产值＝产值÷员工数。"},{"id":"Q065","category":"图形规律","topic":"数量：点数递增","difficulty":1,"stem":"下图从左到右，圆点数每次增加1个。第5幅图应有几个圆点？","options":["6个","5个","7个","8个"],"answer":0,"explanation":"图中圆点数依次为2、3、4、5，下一幅应为6。易错点：应数圆点总数，不是只数某一行。","tip":"数量规律先统一计数口径。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","visual":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 150\" role=\"img\" aria-label=\"下图从左到右，圆点数每次增加1个。第5幅图应有几个圆点？\">\u003crect width=\"640\" height=\"150\" rx=\"12\" fill=\"#f4f7fb\"/>\u003cg transform=\"translate(30.00 18)\">\u003ccircle cx=\"25\" cy=\"25\" r=\"7\" fill=\"#0f766e\"/>\u003ccircle cx=\"50\" cy=\"25\" r=\"7\" fill=\"#0f766e\"/>\u003c/g>\u003ctext x=\"80.00\" y=\"139\" text-anchor=\"middle\" font-size=\"15\" fill=\"#64748b\">1\u003c/text>\u003cg transform=\"translate(190.00 18)\">\u003ccircle cx=\"25\" cy=\"25\" r=\"7\" fill=\"#0f766e\"/>\u003ccircle cx=\"50\" cy=\"25\" r=\"7\" fill=\"#0f766e\"/>\u003ccircle cx=\"75\" cy=\"25\" r=\"7\" fill=\"#0f766e\"/>\u003c/g>\u003ctext x=\"240.00\" y=\"139\" text-anchor=\"middle\" font-size=\"15\" fill=\"#64748b\">2\u003c/text>\u003cg transform=\"translate(350.00 18)\">\u003ccircle cx=\"25\" cy=\"25\" r=\"7\" fill=\"#0f7  height=\"62\" fill=\"#e0f2ef\" stroke=\"#0f766e\" stroke-width=\"2\"/>\u003ctext x=\"125\" y=\"117\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0f766e\">3\u003c/text>\u003crect x=\"156\" y=\"78\" width=\"62\" height=\"62\" fill=\"#e0f2ef\" stroke=\"#0f766e\" stroke-width=\"2\"/>\u003ctext x=\"187\" y=\"117\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0f766e\">4\u003c/text>\u003crect x=\"218\" y=\"78\" width=\"62\" height=\"62\" fill=\"#e0f2ef\" stroke=\"#0f766e\" stroke-width=\"2\"/>\u003ctext x=\"249\" y=\"117\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0f766e\">6\u003c/text>\u003crect x=\"94\" y=\"140\" width=\"62\" height=\"62\" fill=\"#e0f2ef\" stroke=\"#0f766e\" stroke-width=\"2\"/>\u003ctext x=\"125\" y=\"179\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0f766e\">5\u003c/text>\u003c/svg>"},{"id":"Q089","category":"图形规律","topic":"空间：相邻与相对","difficulty":3,"stem":"同一立方体展开图中，哪一组面折叠后彼此相对？","options":["1号面与5号面","1号面与3号面","2号面与3号面","3号面与4号面"],"answer":0,"explanation":"3号面上、下的1和5折起后形成一对相对侧面；1与3、2与3、3与4都是相邻面。易错点：有公共边的两面不可能相对。","tip":"展开图中心面周围上下成对、左右成对。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","visual":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 280\" role=\"img\" aria-label=\"立方体展开图：第二行从左到右2、3、4、6，3的上方1，下方5\">\u003crect x=\"94\" y=\"16\" width=\"62\" height=\"62\" fill=\"#e0f2ef\" stroke=\"#0f766e\" stroke-width=\"2\"/>\u003ctext x=\"125\" y=\"55\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0f766e\">1\u003c/text>\u003crect x=\"32\" y=\"78\" width=\"62\" height=\"62\" fill=\"#e0f2ef\" stroke=\"#0f766e\" stroke-width=\"2\"/>\u003ctext x=\"63\" y=\"117\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0f766e\">2\u003c/text>\u003crect x=\"94\" y=\"78\" width=\"62\" height=\"62\" fill=\"#e0f2ef\" stroke=\"#0f766e\" stroke-width=\"2\"/>\u003ctext x=\"125\" y=\"117\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0f766e\">3\u003c/text>\u003crect x=\"156\" y=\"78\" width=\"62\" height=\"62\" fill=\"#e0f2ef\" stroke=\"#0f766e\" stroke-width=\"2\"/>\u003ctext x=\"187\" y=\"117\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0f766e\">4\u003c/text>\u003crect x=\"218\" y=\"78\" width=\"62\" height=\"62\" fill=\"#e0f2ef\" stroke=\"#0f766e\" stroke-width=\"2\"/>\u003ctext x=\"249\" y=\"117\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0f766e\">6\u003c/text>\u003crect x=\"94\" y=\"140\" width=\"62\" height=\"62\" fill=\"#e0f2ef\" stroke=\"#0f766e\" stroke-width=\"2\"/>\u003ctext x=\"125\" y=\"179\" text-anchor=\"middle\" font-size=\"24\" fill=\"#0f766e\">5\u003c/text>\u003c/svg>"},{"id":"Q090","category":"图形规律","topic":"两种属性共同变化","difficulty":2,"stem":"从左到右，边数每次增加1，同时空心、实心交替。第5幅应是什么？","options":["实心七边形","空心七边形","空心六边形","实心八边形"],"answer":1,"explanation":"边数为3、4、5、6，下一项7；填充为空、实、空、实，下一项空，所以为空心七边形。易错点：两条规律要同时满足。","tip":"把形状、填充等属性分别推演后组合。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力","visual":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 150\" role=\"img\" aria-label=\"从左到右，边数每次增加1，同时空心、实心交替。第5幅应是什么？\">\u003crect width=\"640\" height=\"150\" rx=\"12\" fill=\"#f4f7fb\"/>\u003cg transform=\"translate(30.00 18)\">\u003cpolygon points=\"50.00,14.00 81.18,68.00 18.82,68.00\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"4\"/>\u003c/g>\u003ctext x=\"80.00\" y=\"139\" text-anchor=\"middle\" font-size=\"15\" fill=\"#64748b\">1\u003c/text>\u003cg transform=\"translate(190.00 18)\">\u003cpolygon points=\"50.00,14.00 86.00,50.00 50.00,86.00 14.00,50.00\" fill=\"#0f766e\" stroke=\"#0f766e\" stroke-width=\"4\"/>\u003c/g>\u003ctext x=\"240.00\" y=\"139\" text-anchor=\"middle\" font-size=\"15\" fill=\"#64748b\">2\u003c/text>\u003cg transform=\"translate(350.00 18)\">\u003cpolygon points=\"50.00,14.00 84.24,38.88 71.16,79.12 28.84,79.12 15.76,38.88\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"4\"/>\u003c/g>\u003ctext x=\"400.00\" y=\"139\" text-anchor=\"middle\" font-size=\"15\" fill=\"#64748b\">3\u003c/text>\u003cg transform=\"translate(510.00 18)\">\u003cpolygon points=\"50.00,14.00 81.18,32.00 81.18,68.00 50.00,86.00 18.82,68.00 18.82,32.00\" fill=\"#0f766e\" stroke=\"#0f766e\" stroke-width=\"4\"/>\u003c/g>\u003ctext x=\"560.00\" y=\"139\" text-anchor=\"middle\" font-size=\"15\" fill=\"#64748b\">4\u003c/text>\u003c/svg>"},{"id":"V001","category":"言语理解","topic":"主旨概括","difficulty":1,"stem":"某工厂更新了巡检系统，但员工仍把纸质记录原样录入，异常数据也没有触发处理流程。可见，数字化转型的关键，不只是把工具换成电子设备，而是让数据进入决策和处置环节。这段文字主要强调：","options":["数字化转型需要改变数据使用和业务处置方式","电子设备通常不如纸质记录可靠","数字化转型应优先降低设备采购成本","只要采集足够多的数据就能完成数字化转型"],"answer":0,"explanation":"“可见”后提出核心判断：工具更换不足以完成转型，关键在数据参与决策和处置。文中没有比较记录可靠性和采购成本，也没有把数据数量等同于转型成效。","tip":"找结论标志词，并区分举例与观点。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V002","category":"言语理解","topic":"主旨概括","difficulty":2,"stem":"城市中的老树有时会影响道路改造，但它们也保存着地方记忆，提供遮阴空间。工程方案不应只问“移树要花多少钱”，还应问“能否调整路线保留它”。保护与建设之间，往往存在尚未被认真寻找的兼容方案。这段文字的主旨是：","options":["道路改造的主要成本来自树木迁移","城市建设应主动寻找兼顾发展与老树保护的方案","任何道路改造都应无条件为老树让路","老树的价值只能通过地方记忆衡量"],"answer":1,"explanation":"末句概括了前文，强调主动寻找兼容方案。“无条件让路”把兼顾偷换为绝对优先；另外两项或片面或无依据。","tip":"概括要覆盖价值冲突和解决方向，避免绝对化。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V003","category":"言语理解","topic":"主旨概括","difficulty":2,"stem":"一份报告列出了大量统计结果，却没有交代调查对象如何选取。另一份报告样本较小，但清楚说明了抽样方法和可能的偏差。判断研究是否可靠，不能只看数字是否醒目，还要检查数字是怎样得到的。这段文字主要说明：","options":["报告中的统计数字通常没有参考价值","调查报告只需要说明抽样方法","评价研究可靠性应关注数据形成过程","样本越小的调查越容易得到真实结论"],"answer":2,"explanation":"两份报告的比较用于引出“检查数字怎样得到”的观点。文中并未证明小样本更可靠，也未否定数字价值；“只需要”遗漏了其他质量要求。","tip":"比较材料之后的评价性句子常是主旨。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V004","category":"言语理解","topic":"主旨概括","difficulty":1,"stem":"企业设置建议箱并不难，难的是及时回应员工提出的问题。如果建议长期没有回音，参与热情就会下降；如果处理进度透明，即使有些建议暂时不能采纳，员工也更愿意继续表达。这段文字主要强调：","options":["企业必须采纳员工提出的每一条建议","员工参与程度只取决于奖励多少","建议箱应该由电子问卷完全替代","有效的建议机制需要及时、透明的反馈"],"answer":3,"explanation":"全文围绕反馈是否及时透明影响参与展开，没有要求全部采纳，也没有讨论奖励或替换工具。","tip":"抓住反复出现的共同因素。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V005","category":"言语理解","topic":"主旨概括","difficulty":2,"stem":"跨学科研究并不是把几个专业名词放进同一篇论文。真正的合作，要求不同领域的研究者围绕同一问题，明确各自方法的适用条件，并允许结论接受其他学科的检验。这段文字主要强调：","options":["跨学科研究应围绕共同问题实现方法与检验的实质协作","跨学科研究应放弃各学科原有的方法","一篇论文涉及的学科越多价值越高","跨学科研究只能由同时掌握多门学科的个人完成"],"answer":0,"explanation":"“真正的合作”之后给出实质要求。并非放弃方法、追求学科数量，也没有限定为个人完成。","tip":"“不是……真正……”结构中，重心通常在后半部分。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V006","category":"言语理解","topic":"意图判断","difficulty":2,"stem":"某社区防汛演练每年都准时开展，签到率也很高，但居民说不清避险路线，新搬来的住户甚至不知道集合点。演练的意义不在完成签到，而在紧急情况下能按正确步骤行动。作者意在强调：","options":["只要增加演练次数就能解决所有问题","防汛演练应以居民掌握实际行动方法为重点","应取消社区防汛演练中的签到制度","新住户是防汛工作的唯一重点对象"],"answer":1,"explanation":"材料批评形式完成而能力未形成，意在把重点转向实际行动能力；取消签到、只关注新住户和单纯增加次数都超出了论述。","tip":"从问题推对策时，只走最直接的一步。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V007","category":"言语理解","topic":"意图判断","difficulty":2,"stem":"企业培训中，同一份材料常被用于所有岗位。销售人员觉得技术细节太多，维修人员却认为操作说明太少。培训内容若不考虑岗位任务，再精美的课件也可能收效甚微。作者最可能主张：","options":["所有员工必须接受相同长度的培训","企业应暂停一切跨岗位学习","根据不同岗位的实际任务设计培训内容","培训课件的视觉效果完全没有价值"],"answer":2,"explanation":"问题在内容与岗位任务不匹配，对应对策是按任务设计培训。其余选项分别绝对否定形式、引入时长、否定跨岗学习，均缺乏支持。","tip":"把具体抱怨还原为共同问题，再匹配对策。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V008","category":"言语理解","topic":"意图判断","difficulty":2,"stem":"一些博物馆增加了许多互动屏幕，但观众操作完游戏，仍不了解展品的历史背景。技术可以吸引注意，但若没有服务于知识表达，热闹也可能只是短暂停留。作者意在说明：","options":["博物馆应禁止使用互动游戏","传统文字说明必然优于数字技术","观众是否了解展品与展示方式无关","博物馆的技术应用应服务于展品知识的传达"],"answer":3,"explanation":"作者肯定技术吸引注意的作用，同时强调其应服务知识表达，因此不是全面否定技术，也未比较两种方式的必然优劣。","tip":"留意让步结构：肯定部分作用，再提出核心要求。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V009","category":"言语理解","topic":"意图判断","difficulty":2,"stem":"某团队把“零差错”写进考核，却没有提供复核时间。员工为了不被记录失误，开始回避上报小问题。制度如果只惩罚暴露的问题，就可能使真正的风险沉到水面之下。作者最可能希望管理者：","options":["完善复核和问题报告机制，减少单纯惩罚造成的隐瞒","取消所有质量标准以降低员工压力","仅对重大事故设置报告要求","把员工上报问题的数量直接视为能力不足"],"answer":0,"explanation":"材料中的风险来自缺少支持条件和对暴露问题的单纯惩罚，改进复核与报告机制直接回应原因；其余选项扩大问题或强化隐瞒诱因。","tip":"意图题中的对策必须回应材料指出的原因。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V010","category":"言语理解","topic":"细节理解","difficulty":1,"stem":"某图书馆规定：周一闭馆；周二至周五9时至18时开放；周末9时至20时开放。自助还书箱每天可用，但归还的图书在下一个开馆日办理入库。根据这段文字，下列说法正确的是：","options":["周一投入还书箱的图书当天办理入库","周一可以通过自助还书箱归还图书","周末与工作日的闭馆时间相同","自助还书箱仅在开馆期间可用"],"answer":1,"explanation":"“自助还书箱每天可用”包含周一。周末闭馆较晚，还书箱不受开馆时段限制，周一归还的书要在下一个开馆日入库。","tip":"把“还书可用”与“入库办理”两个条件分开。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V011","category":"言语理解","topic":"细节理解","difficulty":2,"stem":"试点方案允许符合条件的中小企业申请补助。申请材料须在月底前提交，审核通过后才能获得补助；获得补助的企业还须按季度报告资金使用情况。根据上述规定，下列说法正确的是：","options":["所有中小企业均可直接获得补助","申请企业在审核前必须按季度报告资金使用情况","审核通过是获得补助的必要条件","月底前提交材料就一定能获得补助"],"answer":2,"explanation":"“审核通过后才能获得”说明获得补助必须先通过审核。按时提交只是申请要求，企业还须符合条件并通过审核；季度报告义务针对已获补助企业。","tip":"“才能”常表示必要条件，注意义务主体。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V012","category":"言语理解","topic":"细节理解","difficulty":2,"stem":"在一次实验中，研究人员只比较了温度相同、光照不同的两组植物，其他培养条件保持一致。结果显示，较强光照组的平均生长速度更快。研究者指出，该结果仅适用于本次所用植物及光照范围。与原文相符的是：","options":["温度是本次实验主动改变的因素","光照越强，所有植物生长就必然越快","两组植物的所有培养条件都不同","实验结果不能直接推广到所有植物和任意光照强度"],"answer":3,"explanation":"末句明确限制适用对象和光照范围。温度相同，主动改变的是光照；“所有”“任意”“必然”均超出证据。","tip":"科学材料中，范围限定与实验变量是高频考点。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V013","category":"言语理解","topic":"细节理解","difficulty":1,"stem":"某培训分为基础课和实践课。参加实践课者必须先完成基础课，但完成基础课者可自行决定是否参加实践课。两类课程均需预约。下列说法与原文一致的是：","options":["完成基础课并不意味着一定参加实践课","基础课不需要预约","未完成基础课者可直接参加实践课","预约实践课后就不必完成基础课"],"answer":0,"explanation":"原文明确给予完成基础课者选择权，其余三项分别违反预约要求或先修条件。","tip":"不要把必要条件误当充分条件。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V014","category":"言语理解","topic":"细节理解","difficulty":2,"stem":"调查访问了某园区的300名在职员工，其中180人表示愿意乘坐新开通的班车。调查没有访问园区外企业的员工，也没有记录受访者后来是否实际乘坐。下列说法可以由材料直接得出的是：","options":["这300名员工已经全部乘坐过班车","受访者中有60%表示愿意乘坐新班车","园区所有员工中恰有60%实际乘坐班车","园区外企业员工都不愿意乘坐班车"],"answer":1,"explanation":"180÷300=60%，且结论只针对受访者的意愿。将意愿变成实际行为、把样本推广到总体或推断未调查人群，均无依据。","tip":"检查对象、时间和“意愿/行为”是否发生偷换。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V015","category":"言语理解","topic":"合理推断","difficulty":2,"stem":"一种设备只有在环境湿度低于60%时才能稳定运行。今天该设备持续稳定运行了两小时，期间环境湿度保持不变。仅据此可推出：","options":["只要湿度低于60%，设备就一定稳定运行","该设备在任何温度下都能稳定运行","这两小时内环境湿度低于60%","环境湿度越低，设备运行速度越快"],"answer":2,"explanation":"稳定运行以湿度低于60%为必要条件，已知稳定，故该条件满足。不能反向认定条件充分，更不能推断速度或温度。","tip":"“只有……才……”允许从结果推必要条件。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V016","category":"言语理解","topic":"合理推断","difficulty":2,"stem":"某学校试行预约借用实验室后，爽约率从20%降至8%。与此同时，学校还增加了临近使用时间的提醒，但没有设置对照组。根据材料，最稳妥的判断是：","options":["预约制度单独使爽约率下降了12个百分点","提醒措施对爽约率绝对没有影响","今后所有学校采用该办法都能达到8%的爽约率","爽约率确实下降，但不能只据此确定是哪项措施造成的"],"answer":3,"explanation":"两项措施同时变化且没有对照，只能确认观察到的下降，不能分离各措施因果效应，更不能保证外部推广结果。","tip":"把“观察到变化”与“识别出原因”区分开。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V017","category":"言语理解","topic":"合理推断","difficulty":2,"stem":"某公司要求所有外发报告经过复核。小林今天提交的报告尚未复核。公司规定得到严格执行。根据这些信息，能够推出：","options":["小林这份报告目前不能外发","小林的报告必然存在错误","已经复核的报告都已外发","小林以后不能再提交报告"],"answer":0,"explanation":"外发必须经过复核，尚未复核排除了当前外发资格。未复核不等于有错，复核也不意味着一定外发。","tip":"只推出规则直接约束的状态，不补充动机或质量判断。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V018","category":"言语理解","topic":"合理推断","difficulty":2,"stem":"某地推出步行线路后，参加活动的人数增加，但同期恰逢长假，宣传投入也比之前增加。组织者打算据此证明“线路设计是人数增长的唯一原因”。最合理的评价是：","options":["长假必然比线路设计更能增加参加人数","还需排除假期和宣传等其他因素的影响","参加人数增加本身足以证明唯一原因","只要存在其他因素，线路设计就一定没有作用"],"answer":1,"explanation":"材料至少提出了两个可能的替代原因，要证明“唯一原因”需处理这些因素；存在替代解释并不等于线路毫无作用。","tip":"质疑唯一因果，重点寻找未控制的其他因素。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V019","category":"言语理解","topic":"标题选择","difficulty":1,"stem":"修复古建筑时，有些团队将旧砖全部换成新砖，外观整齐了，历史痕迹却消失了。更谨慎的修复会先判断损坏程度，对仍可使用的材料尽量保留，让建筑继续展示时间留下的层次。最适合作为标题的是：","options":["古建筑应停止一切修复","整齐外观是修复的唯一标准","修旧，也要留住旧","新材料决定古建筑的寿命"],"answer":2,"explanation":"文章围绕修复中保留历史材料和痕迹展开，“修旧，也要留住旧”同时概括行动与原则；其余标题偏离或反转主旨。","tip":"标题兼顾概括性和文章的独特关注点。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V020","category":"言语理解","topic":"标题选择","difficulty":2,"stem":"一条城市河流变清，往往不只是河道清淤的结果。上游排放控制、沿岸管网改造和日常维护都可能发挥作用。若只在看得见的河面上用力，治理成果就难以持久。最合适的标题是：","options":["清淤是河流治理的全部","城市河流无需日常维护","上游治理可替代所有工程","治水功夫不只在水面"],"answer":3,"explanation":"标题应突出系统治理超出可见河面的主题；其他选项将某个环节绝对化或否定材料明确强调的维护。","tip":"用覆盖全文的核心关系选标题，避免以偏概全。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V021","category":"言语理解","topic":"标题选择","difficulty":2,"stem":"一套软件上线后，开发团队不再把发布视为终点，而是持续收集用户在真实任务中的困难，按影响范围和严重程度安排修正。产品质量因此在使用中不断改进。最适合作为标题的是：","options":["上线之后，改进仍在继续","软件发布就是项目终点","用户数量决定所有修正顺序","新功能越多，产品质量越好"],"answer":0,"explanation":"全文突出上线后的持续改进。排序依据有影响范围和严重程度，并非仅由用户数量决定；新增功能数量也未被讨论。","tip":"标题应抓住过程变化，而非补入常见但未出现的观点。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V022","category":"言语理解","topic":"语句排序","difficulty":2,"stem":"将下列句子组成连贯的一段话，排序最恰当的是：①因此，团队把复核环节前移到数据采集当天。②起初，团队总在月底集中检查数据。③调整后，录入人员能够趁记忆清楚时核对异常。④这种做法使一些错误直到很晚才被发现。","options":["④③②①","②④①③","②①④③","①②③④"],"answer":1,"explanation":"②交代最初做法，④的“这种做法”回指月底集中检查，①以“因此”提出调整，③以“调整后”说明效果。其他顺序破坏指代或因果。","tip":"先锁定指代对象，再排列“原状—问题—调整—效果”。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V023","category":"言语理解","topic":"语句排序","difficulty":2,"stem":"将下列句子排序，最恰当的是：①但这些碎片并不会自动形成完整判断。②人们每天都能接触到大量信息碎片。③只有进一步核实来源、比较证据，信息才可能转化为知识。④它们可能来自新闻、广告，也可能来自社交平台。","options":["②③④①","①③②④","②④①③","④②③①"],"answer":2,"explanation":"②引入信息碎片，④用“它们”介绍来源，①转折说明局限，③给出信息转为知识的条件。把④放在首句会缺少指代对象。","tip":"总述与指代紧邻，转折之后承接解决办法。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V024","category":"言语理解","topic":"语句排序","difficulty":2,"stem":"将下列句子排序，最恰当的是：①随后，研究人员根据访谈结果设计问卷。②研究开始时，团队先访谈了十名不同岗位的员工。③最后，他们用问卷调查得到的数据检验最初的判断。④这些访谈帮助团队发现了此前忽略的问题。","options":["②①③④","①②④③","④①②③","②④①③"],"answer":3,"explanation":"“开始时”②在前，“这些访谈”④紧接并说明作用，随后①设计问卷，最后③用数据检验，形成完整研究流程。","tip":"时间标记与步骤依赖可共同锁定排序。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V025","category":"言语理解","topic":"语句排序","difficulty":2,"stem":"将下列句子排序，最恰当的是：①这种灵活性使方案能在环境变化时继续发挥作用。②不过，留有余地并不意味着目标可以含糊。③好的计划需要为未预见的情况保留调整空间。④目标明确而路径可调，二者可以同时实现。","options":["③①②④","③②①④","①③④②","②④①③"],"answer":0,"explanation":"③提出调整空间，①解释“这种灵活性”的价值；②用“不过”限定误解，④整合目标明确与路径可调。③②①④把灵活性的说明插在限定与总结之间，衔接较弱。","tip":"先解释原则，再澄清误解，最后综合。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V026","category":"言语理解","topic":"语句衔接","difficulty":2,"stem":"填入横线最恰当的一句是：评价一次培训，不能只统计参加人数。________。如果员工回到岗位后仍不会处理相关问题，即使签到率达到100%，培训也未必有效。","options":["培训结束后就无需再了解员工表现","更应观察所学内容是否转化为实际工作能力","参加人数越多，培训效果就一定越好","培训内容应完全由签到方式决定"],"answer":1,"explanation":"前句否定只看参与数量，后句以不会处理问题说明无效，中间应转向知识是否转化为工作能力。其余选项与上下文相反或无关。","tip":"用横线前后的共同话题和逻辑方向定位。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V027","category":"言语理解","topic":"语句衔接","difficulty":2,"stem":"填入横线最恰当的一句是：开放数据可以提高信息的可用性，但公开越多并不总是越好。________。例如，涉及个人身份和精确位置的信息，需要采取适当保护措施。","options":["只要信息真实，就不会带来任何风险","数据开放的唯一目标是增加文件数量","在提升共享价值的同时，还应考虑隐私与安全边界","所有数据都应不加区分地向社会公开"],"answer":2,"explanation":"“但”后提出公开的边界，后面的隐私例子要求横线概括共享与保护的平衡。其他项否认边界或偏离目的。","tip":"例子之前通常需要能够统摄该例子的概括句。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V028","category":"言语理解","topic":"语句衔接","difficulty":2,"stem":"填入横线最恰当的一句是：一项措施在某个社区有效，不代表在所有社区都同样有效。________。人口结构、空间条件和管理资源的差异，都可能影响实施结果。","options":["成功案例的具体条件可以全部忽略","只要措施名称相同，效果就必然相同","不同社区之间不存在任何可借鉴的经验","推广之前应先分析适用条件是否相近"],"answer":3,"explanation":"后文列举影响实施的条件，横线应提出推广前分析适用条件。既不能无条件推广，也不能彻底否定借鉴。","tip":"警惕把“有条件适用”误写成“完全不能适用”。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V029","category":"言语理解","topic":"语句衔接","difficulty":2,"stem":"填入横线最恰当的一句是：面对一项看似反常的数据，研究者没有立即删除它。________。排查发现，数据并非录入错误，而是设备在特殊工况下真实的表现。","options":["他们先检查采集过程，再核对设备运行记录","他们认定所有异常值都没有分析价值","他们直接用平均值替换了所有记录","他们停止调查并宣布设备运行完全正常"],"answer":0,"explanation":"后文“排查发现”需要前面有调查核对过程，检查采集及运行记录与之顺接；其余选项终止核查或先下结论，无法承接。","tip":"用后文已经发生的动作反推前文应出现的步骤。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V030","category":"言语理解","topic":"逻辑填空","difficulty":1,"stem":"填入横线最恰当的词语是：新制度是否适合一线工作，还需要在实际运行中________，不能仅凭设计者的主观判断。","options":["粉饰","检验","掩饰","搁置"],"answer":1,"explanation":"制度适用性需要用运行结果来检验。“掩饰、粉饰”是遮盖问题，“搁置”则不开展验证，均不合语境。","tip":"先判断句子需要的动作，再比较词义。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V031","category":"言语理解","topic":"逻辑填空","difficulty":2,"stem":"依次填入横线最恰当的一项是：对调查结论既不能________，也不能因存在局限就全盘否定；合理的态度是说明其适用条件，________地使用。","options":["全面否定／武断","认真分析／机械","盲目照搬／审慎","逐项核查／随意"],"answer":2,"explanation":"“既不能……也不能……”两端分别排除盲信和全否定；说明条件后应审慎使用。“逐项核查、认真分析”本属合理行为，不能成为被否定的极端。","tip":"并列或对照结构决定两空的态度方向。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V032","category":"言语理解","topic":"逻辑填空","difficulty":2,"stem":"依次填入横线最恰当的一项是：解决长期积累的问题，很难________；需要把总体目标分解为阶段任务，________地推进。","options":["持之以恒／急于求成","循序渐进／一意孤行","实事求是／朝令夕改","一蹴而就／循序渐进"],"answer":3,"explanation":"长期问题难以一下完成，故“一蹴而就”；分解阶段任务对应“循序渐进”。其余搭配不是前后逻辑相反，就是态度不合。","tip":"用后句的具体做法解释前句成语。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V033","category":"言语理解","topic":"逻辑填空","difficulty":2,"stem":"依次填入横线最恰当的一项是：不同部门对同一指标的定义不一致，会使汇总结果失去________；因此，需要先统一口径，再开展________。","options":["可比性／比较","时效性／保密","趣味性／宣传","偶然性／归档"],"answer":0,"explanation":"指标定义不同导致数据无法按同一标准比较，因此统一口径服务于比较。“时效性”对应时间新旧，与本题原因不匹配。","tip":"原因与结果之间应有直接对应关系。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V034","category":"言语理解","topic":"逻辑填空","difficulty":2,"stem":"填入横线最恰当的一项是：面对新出现的技术，既不因陌生而一概排斥，也不因流行而盲目追随，而应依据实际需要________。","options":["不加甄别","理性选择","随波逐流","固步自封"],"answer":1,"explanation":"两种极端被排除后，语境要求根据需要作判断。“随波逐流”和“不加甄别”接近盲从，“固步自封”接近排斥新事物。","tip":"双重否定极端时，正确项常表达有依据的中间态度。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V035","category":"言语理解","topic":"逻辑填空","difficulty":2,"stem":"依次填入横线最恰当的一项是：报告的措辞应与证据强度相________。只有初步观察时，不宜把“可能有关”写成“必然导致”，以免________结论。","options":["隔绝／修正","替代／收集","匹配／夸大","冲突／验证"],"answer":2,"explanation":"措辞强弱要与证据强度匹配；把可能相关升级为必然因果属于夸大。其余词语搭配或语义不成立。","tip":"注意“可能—必然”“相关—因果”的强度差。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V036","category":"言语理解","topic":"逻辑填空","difficulty":2,"stem":"填入横线最恰当的一项是：团队内部保留不同意见，不是为了制造分歧，而是为了从多个角度检视方案，避免________。","options":["精益求精","集思广益","因地制宜","以偏概全"],"answer":3,"explanation":"多角度检视旨在避免只看到局部便作总体判断，即“以偏概全”。其余词语均属积极做法，不是要避免的偏差。","tip":"先确定空格的褒贬方向，再核对具体语义。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V037","category":"言语理解","topic":"词语理解","difficulty":2,"stem":"“公共设施建设既要看投入，也要看产出；这里的‘产出’，不只是收入，还包括服务可及性和居民使用体验。”句中“产出”的含义最接近：","options":["设施投入使用后形成的综合服务效果","建设过程中购买的设备总量","项目承包方获得的全部收入","施工队完成的建筑面积"],"answer":0,"explanation":"原文明确把产出扩展到服务可及性与体验，指综合服务效果，不局限于收入、物料或建筑面积。","tip":"词语含义以本句限定为准，不机械套用常用义。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V038","category":"言语理解","topic":"词语理解","difficulty":2,"stem":"“方案需要留白：把目标和底线写清楚，同时允许执行人员根据现场条件选择具体方法。”这里的“留白”指：","options":["在文件中故意省略必要信息","在明确边界内保留执行方式的调整空间","不说明目标和底线","把所有责任交给执行人员"],"answer":1,"explanation":"冒号后直接解释“留白”：目标和底线清楚，方法可按现场选择，因此是有边界的灵活空间，而非信息缺失或推卸责任。","tip":"解释性标点后面的内容可直接限定比喻义。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V039","category":"言语理解","topic":"病句辨析","difficulty":2,"stem":"下列句子没有语病的一项是：","options":["这次复盘的主要目的是为了明确改进重点。","团队能否按期完成任务，取决于各项准备工作已经落实。","通过这次复盘，团队明确了下阶段的改进重点。","通过这次复盘，使团队明确了下阶段的改进重点。"],"answer":2,"explanation":"正确句保留“团队”作为主语。“通过……使……”造成主语残缺；“目的是为了”重复；“能否”是两面而“已经落实”只陈述一面，应改为“是否落实”等。","tip":"检查成分残缺、重复赘余与两面对一面。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V040","category":"言语理解","topic":"病句辨析","difficulty":2,"stem":"下列句子没有语病的一项是：","options":["各部门应增强沟通效率，减少重复劳动。","这项工作的顺利完成，是全体成员共同努力的结果造成的。","会议讨论并听取了各小组的汇报。","各部门应及时沟通，减少重复劳动，提高协作效率。"],"answer":3,"explanation":"正确句搭配和顺序均合理。“增强效率”搭配不当，应为提高效率或增强沟通；“结果造成的”结构杂糅；“讨论并听取”顺序颠倒，通常应先听取汇报再讨论。","tip":"辨病句先看谓宾搭配，再看结构和动作先后。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V041","category":"逻辑判断","topic":"充分必要条件","difficulty":1,"stem":"某实验室规定：只要进入操作区，就必须佩戴护目镜。该规定被所有人严格遵守。小周没有佩戴护目镜。一定可以推出：","options":["小周没有进入操作区","小周没有进入实验室任何区域","佩戴护目镜的人都进入了操作区","小周不具备操作资格"],"answer":0,"explanation":"规则是“进入操作区→佩戴护目镜”，否定后件可以否定前件，因此未佩戴者未进入操作区。不能推断其他区域、资格或反向条件。","tip":"若P则Q，必有非Q则非P；不能反推Q则P。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V042","category":"逻辑判断","topic":"充分必要条件","difficulty":1,"stem":"只有完成网上预约的人，才能进入展厅。小吴已经进入展厅，且无人违反该规定。由此必然可知：","options":["没有进入展厅的人一定没有预约","小吴完成了网上预约","小吴一定是第一个预约的人","完成网上预约的人一定都进入了展厅"],"answer":1,"explanation":"“只有预约才进入”表示进入→预约。已进入可推出已预约；预约是否足以进入、预约顺序以及未进入者的预约状态均不能确定。","tip":"“只有A才B”写成B→A。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V043","category":"逻辑判断","topic":"充分必要条件","difficulty":2,"stem":"规定：除非设备已通过检验，否则不得投入使用。下列说法与该规定逻辑含义相同的是：","options":["没有投入使用的设备都未通过检验","设备通过检验与是否使用没有关系","如果设备投入使用，那么它已经通过检验","只要设备通过检验，就必须投入使用"],"answer":2,"explanation":"“除非已检验，否则不得使用”等价于“未检验→不使用”，其逆否命题是“使用→已检验”。其他选项把必要条件改成充分条件或否认约束。","tip":"“除非A否则B”可先改写为非A→B。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V044","category":"逻辑判断","topic":"充分必要条件","difficulty":2,"stem":"系统规定：员工获得操作权限，当且仅当他完成培训且通过考核。小林完成了培训，但未通过考核。一定可以推出：","options":["小林已获得部分操作权限","完成培训的人都没有操作权限","通过考核的人一定没有完成培训","小林没有获得操作权限"],"answer":3,"explanation":"权限与“完成培训且通过考核”互为充要条件。考核未通过使合取条件不成立，因此无权限；规则没有部分权限的安排。","tip":"“且”要求各条件同时满足；“当且仅当”允许双向推理。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V045","category":"逻辑判断","topic":"三段论","difficulty":2,"stem":"所有质量审核员都接受过专项培训。有些新员工是质量审核员。以下哪项必然为真？","options":["有些新员工接受过专项培训","所有新员工都是质量审核员","所有接受过专项培训的人都是新员工","没有质量审核员属于新员工"],"answer":0,"explanation":"“有些新员工”这一批人属于审核员，而全部审核员都受过培训，所以这批新员工也受过培训。不能把有些扩大为所有，也不能倒置包含关系。","tip":"用已存在的“有些”对象沿包含链传递。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V046","category":"逻辑判断","topic":"条件链推理","difficulty":2,"stem":"在当前系统中，凡通过审核的方案均已登记；凡已登记的方案均已生成编号。某方案没有生成编号。可以确定：","options":["只要生成编号，就一定通过了审核","该方案没有通过审核","该方案已经登记但编号暂未显示","没有通过审核的方案都没有编号"],"answer":1,"explanation":"审核→登记→编号。没有编号可逆否推出未登记、未审核。没有审核并不排除通过别的允许流程获得编号，规则也不支持从编号反推审核。","tip":"将条件串成链，再从否定的末端向前推。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V047","category":"逻辑判断","topic":"真假判断","difficulty":3,"stem":"甲、乙、丙三台设备中恰有一台故障。三条判断分别为：①乙故障；②丙故障；③乙没有故障。已知三条判断中恰有两条为真。故障设备是：","options":["甲","无法确定","丙","乙"],"answer":2,"explanation":"①与③互为矛盾，恰有一真。既然总共两真，②必真，因此丙故障。代入后①假、②真、③真，满足所有条件。","tip":"先找矛盾命题，再用总真假数量确定其他陈述。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V048","category":"逻辑判断","topic":"真假判断","difficulty":3,"stem":"红、蓝、绿三个盒子中只有一个装有钥匙。标签分别写着：红盒“钥匙在蓝盒”，蓝盒“钥匙不在蓝盒”，绿盒“钥匙不在红盒”。已知恰好一个标签正确。钥匙在：","options":["蓝盒","绿盒","任意一个盒子都有可能","红盒"],"answer":3,"explanation":"红、蓝两标签互为矛盾，必有一真。总共只有一真，绿标签必须为假，即“钥匙不在红盒”为假，所以钥匙在红盒。代入后仅蓝标签正确。","tip":"矛盾对已占一个真，其他陈述即可确定真假。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V049","category":"逻辑判断","topic":"真假判断","difficulty":2,"stem":"甲、乙两人中恰有一人拿走了文件。甲说：“我们两人都没拿。”乙说：“是甲拿的。”已知两句话中恰有一句为真。可以确定：","options":["是甲拿走了文件","是乙拿走了文件","两人都拿走了文件","两人都没拿走文件"],"answer":0,"explanation":"题干已知有人拿走，所以甲的“都没拿”必假。恰有一真，因此乙的话为真，拿文件的是甲。两人都拿或都没拿也违反恰一人条件。","tip":"利用题干事实先确定一句话的真假，避免无谓枚举。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V050","category":"逻辑判断","topic":"真假判断","difficulty":2,"stem":"三项任务中，甲说：“至少一项已完成。”乙说：“三项全部完成了。”已知这两句话恰有一句为真。一定成立的是：","options":["恰好两项任务完成","至少一项完成，且至少一项未完成","三项任务全部未完成","三项任务全部完成"],"answer":1,"explanation":"若乙真则甲也真，与恰一真冲突，故乙假甲真。完成数量只能是1或2，不能确定恰好2。","tip":"有包含关系的陈述，较强陈述为真会带出较弱陈述。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V051","category":"逻辑判断","topic":"削弱论证","difficulty":2,"stem":"公司发现，主动报名参加培训的员工，年终绩效普遍高于未报名者，于是认为“培训提高了员工绩效”。以下哪项最能削弱这一结论？","options":["培训材料可以在线阅读","有些未报名者知道培训的存在","报名者在培训开始前的绩效就普遍更高","培训安排在周末进行"],"answer":2,"explanation":"培训前已存在的差异说明报名可能筛选了原本表现更好的人，培训与高绩效的关系不一定是因果。时间、材料形式和知晓情况未直接说明绩效差异来源。","tip":"比较自愿参加者与未参加者时，优先检查选择偏差。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V052","category":"逻辑判断","topic":"削弱论证","difficulty":2,"stem":"某车间更换照明设备后，月总用电量下降15%，管理者据此认定“新照明设备使车间总用电量下降15%”。以下哪项最能削弱？","options":["新照明设备颜色与旧设备不同","员工对照明的外观评价较好","新设备由不同供应商提供","同月车间减少了生产班次，主要生产设备运行时间明显缩短"],"answer":3,"explanation":"生产班次减少会直接降低主要设备耗电，是总用电下降的替代原因，使15%的下降无法全归于照明。其余信息不涉及耗电变化的有效原因。","tip":"总量下降可能来自业务规模变化，不能直接等同于设备节能效果。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V053","category":"逻辑判断","topic":"削弱论证","difficulty":2,"stem":"某应用只向最近一周每天登录的用户发放满意度问卷，结果90%的受访者满意。团队据此认为“全部注册用户中约90%满意”。以下哪项最能削弱？","options":["许多不满意用户已经很少登录或停止登录该应用","问卷只有五道问题","问卷在周五发布","一些受访者使用深色界面"],"answer":0,"explanation":"调查只覆盖高活跃用户，流失或低活跃的不满意用户被系统遗漏，样本无法代表全部注册用户。其余描述不必然产生与满意度有关的偏差。","tip":"检查抽样入口是否把某类意见排除在外。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V054","category":"逻辑判断","topic":"削弱论证","difficulty":2,"stem":"研发人员说：“新预警系统在历史故障记录中都标出了异常，因此上线后能提前阻止故障。”以下哪项最能削弱这一推论？","options":["工作人员能够打开这些历史文件","历史记录中的异常信号多数在故障已经发生后才出现","系统界面使用了红色标记","历史记录按时间顺序保存"],"answer":1,"explanation":"如果信号出现在故障之后，识别异常不能证明具备事前预警和阻止能力。其他选项只描述展示或保存方式，不触及提前性。","tip":"检测出已经发生的问题，不等于能提前预测。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V055","category":"逻辑判断","topic":"加强论证","difficulty":2,"stem":"某团队认为，发送临近预约时间的提醒可以减少爽约。以下哪项最能支持这一判断？","options":["提醒消息使用了简短文字","预约系统采用了新的配色","将预约者随机分为两组，其他条件相同，收到提醒组的爽约率显著更低","许多预约者表示喜欢收到消息"],"answer":2,"explanation":"随机分组并保持其他条件相同，直接比较提醒与否的结果，较好排除了混杂因素。喜好只是态度，文本长度和配色也未证明爽约减少。","tip":"加强因果优先选有对照、直接测量结果的证据。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V056","category":"逻辑判断","topic":"加强论证","difficulty":2,"stem":"某网站认为，启用缓存能够缩短页面加载时间。以下哪项最能支持？","options":["用户更喜欢网站的新图标","开发人员认为缓存是热门技术","网站增加了新的帮助页面","在同一设备和网络下，对相同页面反复交替启用与关闭缓存，启用时加载稳定更快"],"answer":3,"explanation":"同设备同网络、同页面的交替比较直接检验缓存效果，并控制主要条件。偏好、流行程度与新增页面均不能证明加载速度改善。","tip":"选能连接“措施”与“目标结果”的直接证据。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V057","category":"逻辑判断","topic":"加强论证","difficulty":2,"stem":"居民怀疑夜间噪声主要来自附近的一台风机。以下哪项最能支持这一判断？","options":["在其他设备照常运行、天气相近的多次测试中，该风机停机时噪声明显下降，重启后又恢复","风机外壳涂有醒目的颜色","风机附近的道路很宽","一名居民以前从事过机械工作"],"answer":0,"explanation":"在其他条件相近时，噪声随风机开停反复变化，建立了较直接的因果联系。颜色、道路宽度和居民职业都没有测量该风机的噪声贡献。","tip":"反复开关干预比一次同时发生更能支持因果。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V058","category":"逻辑判断","topic":"加强论证","difficulty":2,"stem":"产品团队认为，新手引导能够提高用户首次独立完成操作的比例。以下哪项最能支持？","options":["新用户都拥有手机","同批新用户随机分组，任务相同，有引导组独立完成率为82%，无引导组为54%","引导页面的插图受到设计师好评","有引导组的页面文字更多"],"answer":1,"explanation":"随机分组、相同任务下的完成率差异直接支持引导提升完成率。审美评价、字数和设备拥有情况并未证明任务完成效果。","tip":"用题目要求的结果指标评价证据相关性。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V059","category":"逻辑判断","topic":"前提假设","difficulty":3,"stem":"研究人员提出：提高采样频率能让异常更早被发现，因此提高采样频率能够减少设备停机损失。上述推论至少需要以下哪项前提？","options":["采样频率越高，设备耗电一定越少","每名员工都能独立维修所有设备","至少有一部分异常在更早发现后，可以通过及时措施减少停机损失","所有异常都能被永久消除"],"answer":2,"explanation":"从“早发现”到“少损失”缺少可采取有效行动的桥梁。若更早发现也完全无法减少损失，结论就不成立；不需要消除全部异常或人人全能。","tip":"寻找原因与结果之间缺失的一环，可用否定代入法。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V060","category":"逻辑判断","topic":"前提假设","difficulty":3,"stem":"培训者认为，把流程画成图能更清楚地呈现先后关系，因此这些流程图能帮助目标学员理解操作步骤。该论证依赖的必要前提是：","options":["流程图必须使用至少五种颜色","所有文字说明都没有帮助","每名学员都比培训者更熟悉流程","目标学员能够理解流程图使用的符号和基本表达方式"],"answer":3,"explanation":"如果目标学员完全无法理解符号和表达，图中呈现的关系就无法帮助他们理解步骤。颜色数量、否定所有文字和学员水平高于培训者都不是必要条件。","tip":"对必要前提取反，检查论证桥梁是否断裂。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V061","category":"逻辑判断","topic":"前提假设","difficulty":3,"stem":"现有仓库缺少存放某类低温物资的空间。经理说：“隔壁新仓库还有足够空位，把这些物资移过去，就能解决存储空间不足的问题。”该推论需要补充的关键前提是：","options":["新仓库能够满足这类物资的低温存储要求","新仓库的墙面颜色与旧仓库相同","公司今后永远不再增加库存","新仓库离办公楼更近"],"answer":0,"explanation":"空位只有满足该类物资的存储要求才构成可用容量，因此低温条件是关键。墙面、办公距离和永不增库均不支撑当前可存储性。","tip":"“物理空间足够”不等于“符合用途要求”。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V062","category":"逻辑判断","topic":"前提假设","difficulty":3,"stem":"单位计划用手机消息替代纸质通知，并认为不会因此让任何需要知晓通知的人失去获取通知的途径，理由是这些人都有手机。该论证还需要哪项前提？","options":["手机的购买价格完全相同","这些人都能够接收并查阅通知所使用的手机消息","纸质通知的字体必须大于手机字体","所有人都更喜欢手机外观"],"answer":1,"explanation":"拥有手机不等于能使用特定消息渠道；要保证获取途径不丢失，必须具备接收和查阅能力。本题只讨论获取途径，不要求证明每个人实际认真阅读。","tip":"注意设备拥有与功能可达之间的隐含跳跃。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V063","category":"逻辑判断","topic":"必然结论","difficulty":2,"stem":"所有安全检查员都持有上岗证。有些参加培训的人是安全检查员。以下哪项一定成立？","options":["所有持有上岗证的人都参加了培训","参加培训的人中没有安全检查员","有些参加培训的人持有上岗证","所有参加培训的人都是安全检查员"],"answer":2,"explanation":"将“有些参加培训的人”代入检查员集合，再由检查员包含于持证者集合，可得有些培训者持证。不能将有些扩大为全部或逆转集合关系。","tip":"画包含关系时保留“有些”的存在性。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V064","category":"逻辑判断","topic":"必然结论","difficulty":2,"stem":"所有备选方案都存在一定风险。有些备选方案成本较低。以下哪项必然为真？","options":["成本较低的方案都没有风险","所有存在风险的方案成本都较低","没有成本较低的备选方案","有些成本较低的备选方案存在风险"],"answer":3,"explanation":"已知存在成本较低的备选方案，而所有备选方案都有风险，因此其中至少一些低成本方案有风险。材料不支持风险与成本之间的全称关系。","tip":"全称性质可传给其子集中的已知对象。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V065","category":"逻辑判断","topic":"必然结论","difficulty":1,"stem":"四名员工参加测试，其中至多一人未通过。以下哪项一定成立？","options":["至少三人通过测试","恰好三人通过测试","四人全部通过测试","至少两人未通过测试"],"answer":0,"explanation":"至多一人未通过表示未通过人数为0或1，通过人数因此为4或3，必然至少3人，但不能确定恰好3人或全通过。","tip":"“至多”包含边界以下情况，“至少”包含边界以上情况。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V066","category":"逻辑判断","topic":"必然结论","difficulty":2,"stem":"活动方案规定：如果下雨，活动一定在室内举行。今天活动只在室外举行，且方案得到严格执行。可以推出：","options":["今后活动都应在室外举行","今天没有下雨","不下雨时活动一定在室外举行","在室内举行活动就说明下雨"],"answer":1,"explanation":"下雨→室内。已知只在室外，意味着未在室内，否定后件可推未下雨。不能把规则倒置，也不能将当天事实推广到今后。","tip":"先确认“只在室外”确实否定了“在室内”。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V067","category":"逻辑判断","topic":"解释现象","difficulty":2,"stem":"某图书馆增加了馆藏资源，总借阅人次也上升，但纸质图书借出册数下降。以下哪项最能解释这一现象？","options":["纸质图书的书脊颜色更多了","馆员的工作服样式没有变化","新增资源主要是电子书，许多读者转而借阅电子书","图书馆更换了大厅地毯"],"answer":2,"explanation":"资源增长和总人次增加可以由电子书贡献，同时用户由纸质转向电子会使纸质借出下降，因此三项现象并不冲突。其他信息无法解释借阅结构变化。","tip":"总体与子项变化相反时，检查结构替代。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V068","category":"逻辑判断","topic":"解释现象","difficulty":3,"stem":"某单位今年各职级的工资标准都没有变化，但员工平均工资比去年提高了。以下哪项最能解释？","options":["员工姓名的平均字数增加了","各职级工资均同时下降","单位更换了考勤系统的登录界面","高工资职级的员工占比提高了"],"answer":3,"explanation":"平均工资是各职级工资按人数占比加权的结果。即使各标准不变，高工资职级占比提高也可抬升平均值。“各职级工资均同时下降”直接违背工资标准未变的前提。","tip":"平均数变化既可能来自各项数值，也可能来自权重。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V069","category":"逻辑判断","topic":"解释现象","difficulty":2,"stem":"道路改造后，城区主要路段平均拥堵时间缩短，但某条公交线路乘客的平均通勤时间反而增加。以下哪项最能解释？","options":["该公交线路为覆盖新区而延长了路线，并新增多个停靠站","公交车的车身广告更换了颜色","多数乘客喜欢阅读城市新闻","城区所有公交线路都完全没有调整"],"answer":0,"explanation":"路线变长、停站增多会增加车上时间，即使道路更通畅，也可能导致该线路总体通勤更久。其余信息没有给出足以抵消拥堵改善的时间因素。","tip":"局部指标改善不保证总时间下降，寻找新增耗时环节。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V070","category":"逻辑判断","topic":"类比推理","difficulty":1,"stem":"“温度计：温度”与下列哪组关系最为相似？","options":["钥匙：房门","直尺：长度","地图：城市","水杯：饮水"],"answer":1,"explanation":"温度计是测量温度的工具，直尺是测量长度的工具。地图表示地理信息，水杯容纳饮品，钥匙开启门锁，都不是工具与直接测量量的对应关系。","tip":"先将题干关系写成一句精确的话。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V071","category":"逻辑判断","topic":"类比推理","difficulty":2,"stem":"“校对：文稿：文字差错”与下列哪组关系最为相似？","options":["运输：物资：市场价格","粉刷：墙面：建筑高度","排查：设备：潜在故障","装订：书本：阅读兴趣"],"answer":2,"explanation":"校对是在文稿中查找文字差错，排查是在设备中查找潜在故障，均为“查找动作—对象—要发现的问题”。其他动作与第三项不构成查找关系。","tip":"三项类比要逐一匹配角色，不能只看主题接近。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V072","category":"逻辑判断","topic":"类比推理","difficulty":2,"stem":"“种子：幼苗：成熟植株”与下列哪组关系最为相似？","options":["纸张：书页：书架","河流：湖泊：海洋","铁矿：铁钉：铁锤","卵：雏鸟：成鸟"],"answer":3,"explanation":"种子、幼苗、成熟植株构成同一生命个体的发育阶段，与卵、雏鸟、成鸟相似。其余组不是同一个体的连续发育过程。","tip":"关系必须同方向、同层次，并能按阶段连续发展。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V073","category":"逻辑判断","topic":"定义判断","difficulty":2,"stem":"机会成本是指：选择某种方案时，所放弃的其他可行方案中价值最高者的价值。小李周末只能选择一项活动：兼职可赚300元，参加有酬调查可赚180元，在家整理资料无收入。仅按这三项可量化收入计算，他选择在家整理资料的机会成本是：","options":["300元","480元","180元","0元"],"answer":0,"explanation":"他放弃的两项可行方案分别价值300元和180元，机会成本取其中最高值300元，不是两项相加；题干已限定只考虑可量化收入。","tip":"机会成本取最佳被放弃方案，非所有备选收益之和。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V074","category":"逻辑判断","topic":"定义判断","difficulty":2,"stem":"逆向规划是指：先明确目标状态，再从目标倒推必要条件和前序步骤。下列最符合该定义的是：","options":["把过去所有活动照片按文件名排序","为按期办展，先确定开幕日，再倒排布展、运输和制作的截止时间","先随机购买材料，再考虑能制作什么作品","每天重复昨日工作，不设最终目标"],"answer":1,"explanation":"倒排从开幕目标反推布展、运输、制作，是目标到前序条件的反向推导。其他选项分别无目标试探、机械重复和资料排序，没有倒推。","tip":"定义题先提取必要要素，再逐个核对选项。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V075","category":"逻辑判断","topic":"定义判断","difficulty":2,"stem":"沉没成本是已经发生、无论未来选择如何都不能收回的成本。下列最符合该定义的是：","options":["随时可以全额退款的订金","尚未购买设备的报价","某方案已支付且不可退还的前期设计费","明天才决定是否支付的运输费"],"answer":2,"explanation":"设计费已经支付且不可退还，同时满足已发生和不可收回。未来运输费与设备报价尚未发生，全额可退订金不满足不可收回。","tip":"“已经发生”与“不能收回”两个条件缺一不可。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V076","category":"逻辑判断","topic":"定义判断","difficulty":3,"stem":"幸存者偏差是指：只观察经过某种筛选而保留下来的对象，却忽视被淘汰或消失的对象，从而作出偏差判断。下列最符合该定义的是：","options":["随机抽取成功和失败的创业者比较经验","同时记录正常与损坏设备的使用条件","对完整名单中的员工逐一调查","只采访创业成功者，就认定所有辍学创业者都容易成功"],"answer":3,"explanation":"只访问成功者遗漏失败者，却推断全部创业者，完全符合筛选留存样本导致偏差的定义。其余选项主动覆盖不同结果或完整总体。","tip":"寻找“只看留下来的”与“推广到全部”的组合。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V077","category":"逻辑判断","topic":"排列约束","difficulty":2,"stem":"甲、乙、丙、丁四人从左到右坐成一排。甲紧挨在乙左边，丁坐最右边，丙不坐最左边。丙坐在从左起第几个位置？","options":["第三个","第一个","第二个","第四个"],"answer":0,"explanation":"丁占第4位，甲乙只能连续占1、2位或2、3位。若占2、3位，则丙只能在第1位，与条件冲突。因此甲乙占1、2位，丙在第3位。","tip":"把相邻对象看成一个块，再用边界条件排除。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V078","category":"逻辑判断","topic":"排列约束","difficulty":3,"stem":"甲、乙、丙三个项目分别安排在周一、周二、周三，每天一个。甲不在周一，乙安排在丙之后。一定可以确定：","options":["甲在周三","丙在周一","甲在周二","乙在周二"],"answer":1,"explanation":"如果丙在周二，则乙只能周三，甲被迫周一，矛盾；丙不可能周三，因为乙还要在后。因此丙必在周一。甲乙在周二周三的先后仍可能变化。","tip":"问“必然”时找所有合法方案的共同点。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V079","category":"逻辑判断","topic":"分配约束","difficulty":2,"stem":"甲、乙、丙三人分别负责P、Q、R三项任务，每人一项且互不重复。甲不负责P，乙既不负责P也不负责R。甲负责哪项？","options":["Q","无法确定","R","P"],"answer":2,"explanation":"乙不能P也不能R，所以负责Q。剩余P、R分给甲丙，甲又不能P，故甲负责R，丙负责P。","tip":"优先寻找只剩一个可选项的对象。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"V080","category":"逻辑判断","topic":"组合约束","difficulty":3,"stem":"从甲、乙、丙、丁四人中恰选两人参加会议，要求：至少选甲或乙中的一人；如果选甲就必须选丙；乙和丁不能同时入选。谁一定不能入选？","options":["甲","乙","丙","丁"],"answer":3,"explanation":"含丁的组合仅有甲丁、乙丁、丙丁。甲丁因选甲还需丙而违反恰选两人；乙丁被禁止；丙丁不含甲乙而违规。合法组合为甲丙、乙丙，故丁一定不能入选。","tip":"把待检对象固定，枚举与它搭配的少量组合。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思维能力"},{"id":"E001","category":"思想素质","topic":"诚信记录","difficulty":1,"stem":"实验结果与预期不一致。以下哪些做法有助于保持科研诚信并推动问题解决？（多选）","options":["保留原始数据及实验条件","只保留符合预期的数据","将已知事实与原因猜测分开报告","用历史数据替代本次结果而不说明"],"answer":[0,2],"explanation":"建议选择：保留原始数据便于追溯；区分事实与猜测便于核查。选择性删除和未说明的替换会破坏数据真实性。 此为原创练习参考判断，不代表官方题型安排或评分标准。","tip":"事实如实记录，原因另行验证。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质","type":"multiple"},{"id":"E002","category":"思想素质","topic":"责任担当","difficulty":2,"stem":"你发现自己昨天提交的统计表中有一个错误，可能影响采购数量，采购尚未下单。应如何处理？","options":["先悄悄修改自己的文件，等别人发现再解释","立即告知相关负责人，提供更正表并说明影响范围，跟踪旧表替换","把错误归因于提供数据的同事","等采购完成后在月报中统一纠正"],"answer":1,"explanation":"建议选择：错误尚未造成采购后果，及时告知并追踪替换能降低损失。仅改本地文件不能保证接收方使用新版本，推责也不能解决问题。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"纠错要通知、替换、闭环。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E003","category":"思想素质","topic":"安全底线","difficulty":2,"stem":"一项作业的必要安全确认尚未完成，现场有人建议先开工以免延误。你应优先？","options":["先安排经验丰富的人开工，其他人等待","只做口头提醒，是否开工由大家投票","按职责阻止未经确认的开工，联系负责人落实要求后再启动","先开始最容易的步骤，之后补填确认记录"],"answer":2,"explanation":"建议选择：进度不能替代必要安全条件。应按规定确认作业条件和权限，而非凭经验或投票绕开要求。本题是原则判断，现场操作仍须遵守具体规程。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"必要安全条件不能事后补。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E004","category":"思想素质","topic":"利益冲突","difficulty":3,"stem":"你参加供应商评审，发现其中一家公司的负责人是你的近亲属。该公司报价较低。最合适的是？","options":["认为报价低就无需说明关系","私下向其他评委解释该公司很可靠","直接给该公司最低分以证明公正","主动披露关系，按制度回避或接受相应限制，由无利益冲突人员评审"],"answer":3,"explanation":"建议选择：利益冲突应透明披露并按制度处理；刻意抬高或压低分数都不是客观评审。低价也不能消除关系可能带来的影响。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"披露关系，依规回避，客观评价。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E005","category":"思想素质","topic":"保密意识","difficulty":1,"stem":"处理未公开项目资料时，下列哪些做法较妥当？（多选）","options":["仅凭对方口头保密承诺外发全文","先核实资料分类、业务需要与授权范围","可用公开资料回应一般学习咨询","只要去掉文件名就可对外提供"],"answer":[1,2],"explanation":"建议选择：权限和业务必要性应先确认；公开资料可满足一般咨询。口头承诺和删除文件名不能代替授权。 此为原创练习参考判断，不代表官方题型安排或评分标准。","tip":"用途善意不等于获得授权。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质","type":"multiple"},{"id":"E006","category":"思想素质","topic":"协作沟通","difficulty":2,"stem":"跨部门任务临近截止，对方尚未交付关键数据。你已发过一次消息但未收到回复。最合适的是？","options":["继续每天发送同样消息，不调整沟通方式","直接联系确认卡点与交付时间，必要时同步共同负责人协调资源","在大群里指责对方拖延并要求所有人评理","用未经验证的估计数据代替正式数据且不标注"],"answer":1,"explanation":"建议选择：目标是解决依赖关系。先确认原因与具体时间，超过权限再协调；反复催促、公开指责或伪造替代数据都无助于可靠交付。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"依赖任务要确认责任人和时间点。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E007","category":"思想素质","topic":"意志品质","difficulty":2,"stem":"你连续两次在岗位技能练习中未达标，但复盘发现薄弱点较集中。下一步最合适的是？","options":["认定自己不适合这项工作，立即停止学习","每天重复原来的练习方式，只增加时长","围绕薄弱点分解训练，请教熟练人员，并用阶段测试检验改进","只练自己已经熟练的项目以增强信心"],"answer":2,"explanation":"建议选择：坚持需要有效方法。定位薄弱点、针对性练习和反馈构成改进循环；单纯重复或回避薄弱点难以提高。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"韧性是持续改进，不是机械硬撑。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E008","category":"思想素质","topic":"质量责任","difficulty":3,"stem":"一批材料抽检发现异常，尚不能确定是否整批不合格，但明天必须交货。应如何处理？","options":["先发出，待客户使用后再决定是否检测","挑外观看起来好的材料发货，免去复核","把异常结果单独保存，不计入本次验收","按流程标识并控制疑似问题批次，报告并安排复核，与需求方沟通影响"],"answer":3,"explanation":"建议选择：疑似质量问题应先控制风险、查清范围，再按授权决定处置。不能把不确定性转嫁给客户，也不能因交期删去异常。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"不确定质量先受控，再核实处置。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E009","category":"思想素质","topic":"合规意识","difficulty":1,"stem":"关于费用报销，哪些做法符合诚信与合规原则？（多选）","options":["如实填写用途和金额","为更快审批改变支出用途描述","按规定补齐凭证并说明紧急原因","通过拆分支出规避应有审核"],"answer":[0,2],"explanation":"建议选择：用途、金额、凭证都要真实，紧急事项可以说明并依规协调；虚构或拆分规避不是效率改进。 此为原创练习参考判断，不代表官方题型安排或评分标准。","tip":"真实记录不能让位于报销速度。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质","type":"multiple"},{"id":"E010","category":"思想素质","topic":"公共责任","difficulty":2,"stem":"社区居民反映项目施工噪声影响休息，团队暂未掌握测量结果。最合适的回应是？","options":["在没有检测前直接认定投诉不实","记录具体时段与影响，安排核查和必要措施，及时反馈处理进展","只强调项目对当地经济有贡献","先承诺绝不再有任何声音，之后再研究"],"answer":1,"explanation":"建议选择：应尊重合理关切，以调查事实和可执行措施回应。未核查先否认或作不现实承诺，都会削弱信任。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"先倾听核实，再采取措施并反馈。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E011","category":"思想素质","topic":"工作优先级","difficulty":2,"stem":"你同时接到一项安全隐患信息核实任务和一项普通宣传材料排版任务，两项截止时间接近。合理做法是？","options":["两项任务各做一半，均暂不向负责人说明","优先做更容易获得表扬的排版任务","优先处理可能涉及安全风险的核实，同时向相关负责人说明并协调排版交付","完全取消宣传任务，不通知任何人"],"answer":2,"explanation":"建议选择：优先级应综合风险、紧迫性和影响。安全相关事项先处理，同时沟通资源与期限，避免其他任务无声失约。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"风险优先，变更同步。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E012","category":"思想素质","topic":"团队评价","difficulty":3,"stem":"团队成果汇报时，你发现负责人误把同事完成的一项工作归为你的贡献。你应？","options":["接受表扬，认为纠正会破坏气氛","当场指责负责人不了解项目","以后给同事一些帮助作为补偿，不澄清事实","在合适时机澄清分工，肯定同事贡献，同时准确说明自己的工作"],"answer":3,"explanation":"建议选择：准确呈现贡献有助于团队信任。可以尊重场合但应及时纠正事实；私下补偿不能替代客观归属。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"尊重场合，也要尊重事实。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E013","category":"思想素质","topic":"责任边界","difficulty":1,"stem":"同事请你代签一份你没有参与核验的验收记录，称“大家很忙，形式而已”。应如何处理？","options":["说明不能对未核验事项签认，协调实际核验或有权限人员按流程处理","为了团队配合直接签名","让同事模仿你的签名，自己不动笔","签名后加一句“仅供参考”，视为免责"],"answer":0,"explanation":"建议选择：签认表示相应职责与事实确认，不能用配合之名虚签。应解决核验资源问题，备注也不能替代必要核验。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"签字对应事实与职责。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E014","category":"思想素质","topic":"学习适应","difficulty":2,"stem":"单位上线新系统，你已能用旧系统熟练完成任务，但新系统将成为统一工具。合适的态度是？","options":["坚持只用旧系统，等系统完全成熟再学","参加培训并练习关键流程，记录问题向支持团队反馈","未学习就让他人长期代替自己操作","在不懂权限设置时自行尝试修改所有配置"],"answer":1,"explanation":"建议选择：适应变化应通过学习和反馈完成。熟悉旧工具不构成长期回避新要求的理由，未知配置也不应随意更改。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"先学关键流程，再反馈具体问题。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E015","category":"思想素质","topic":"尊重差异","difficulty":2,"stem":"新同事在讨论中提出与多数人不同的方案，且能给出初步依据。团队应如何对待？","options":["因其资历浅而不予讨论","为体现创新直接全盘采用，无须验证","围绕证据、成本和风险比较方案，必要时安排小范围验证","以多数人的意见为准，不听论证"],"answer":2,"explanation":"建议选择：不同观点值得基于事实评估。尊重不是无条件采用，经验和人数也不能取代证据与验证。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"对观点看依据，对人员保持尊重。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E016","category":"思想素质","topic":"持续改进","difficulty":3,"stem":"同类交接遗漏反复发生，哪些措施有助于持续改进？（多选）","options":["仅要求员工口头保证不再出错","分析反复遗漏的共同原因","完善清单、责任确认和必要复核","实施后跟踪遗漏是否减少"],"answer":[1,2,3],"explanation":"建议选择：共因分析、机制改进和效果验证构成闭环。口头保证不能单独解决反复出现的流程问题。 此为原创练习参考判断，不代表官方题型安排或评分标准。","tip":"重复错误要找机制原因。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质","type":"multiple"},{"id":"E017","category":"思想素质","topic":"廉洁自律","difficulty":1,"stem":"业务往来的供应商送来一张个人购物卡，希望你在后续验收中“多关照”。应如何处理？","options":["明确拒收并按单位要求报告、登记或退还，验收仍依标准进行","收下但承诺不会降低验收标准","转送给家人，自己不使用","等验收完成后再收，认为此时没有关系"],"answer":0,"explanation":"建议选择：礼品与业务便利挂钩形成明显不当影响。坚持标准还需妥善处理礼品及报告，转送或延后接受不改变问题性质。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"业务利益与个人收益不能交换。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E018","category":"思想素质","topic":"信息核实","difficulty":2,"stem":"工作群出现“公司将全面取消某项福利”的消息，没有正式来源。你应？","options":["立即转发到其他群，让大家提前准备","向有职责的渠道核实，提醒群内不要把未证实信息当作通知传播","根据个人猜测写一段政策解读","删除自己的聊天记录，之后不再关注"],"answer":1,"explanation":"建议选择：涉及员工利益的信息应核查正式来源。转发与猜测会放大误解，保留核实意识并向适当渠道询问更负责。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"先找来源，再判断和传播。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E019","category":"思想素质","topic":"担当与权限","difficulty":2,"stem":"面对客户提出的超出本人权限的紧急需求，哪些做法合理？（多选）","options":["先作无法保证的完整承诺","说明需要进一步确认的事项","直接说不归自己管并结束沟通","协调有权人员评估，并给出反馈时间"],"answer":[1,3],"explanation":"建议选择：合理担当包括透明说明和主动协调；越权承诺增加履约风险，简单推诿则没有推进解决。 此为原创练习参考判断，不代表官方题型安排或评分标准。","tip":"不越权、不推诿，明确反馈节点。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质","type":"multiple"},{"id":"E020","category":"思想素质","topic":"抗压能力","difficulty":3,"stem":"任务压力增大，你开始频繁漏看关键检查项。你应？","options":["为了证明能力减少休息，保持原任务量","隐瞒差错，只在没人时补上","把检查步骤全部交给软件且不确认结果","及时说明负荷与风险，调整安排并使用复核清单，必要时申请支持"],"answer":3,"explanation":"建议选择：压力管理服务于可靠交付。出现失误信号时应调整工作方式和资源；硬撑或无验证地依赖工具可能扩大风险。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"压力过载要管理，不把冒险当坚强。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E021","category":"思想素质","topic":"服务意识","difficulty":1,"stem":"客户投诉产品说明不清楚，你查到说明符合格式要求，但确实容易误解。最合适的是？","options":["先解释并解决当前疑问，再收集问题推动说明改进","只告诉客户文件完全合规，不再解释","答应为所有客户提供超出能力范围的上门服务","直接删掉有争议的说明段落"],"answer":0,"explanation":"建议选择：符合格式并不等于沟通有效。服务应解决具体问题，同时基于反馈改善；不应过度承诺或擅自删除必要信息。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"合规是基础，易理解也重要。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E022","category":"思想素质","topic":"求真务实","difficulty":2,"stem":"汇报项目进度时，某环节“已提交审批”但尚未批准。应如何表述？","options":["写成已完成，因后续大概率会通过","明确写已提交、待审批，并说明后续节点和风险","不写该环节，避免引起疑问","用“基本全部完成”掩盖审批状态"],"answer":1,"explanation":"建议选择：进度表述应区分完成、提交、审批中等状态。状态准确才能安排依赖事项，乐观预测不能替代实际结果。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"状态要具体，预测不充当事实。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E023","category":"思想素质","topic":"生态责任","difficulty":2,"stem":"你发现一个节能改进方案可能减少能耗，但是否影响产品质量尚不清楚。应如何推进？","options":["为尽快降耗立即在所有装置使用","因存在不确定性就永久搁置","论证质量与安全影响，经批准试点，比较能耗和质量数据后再推广","只记录节能数据，不考察质量变化"],"answer":2,"explanation":"建议选择：绿色改进需兼顾安全、质量和全流程效果。小范围验证和综合评价比盲目推广或因噎废食更稳妥。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"节能效果与质量安全一起验证。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E024","category":"思想素质","topic":"工作交接","difficulty":3,"stem":"你临时需要请假，手中任务有两个临近截止的事项。最合适的是？","options":["只发一句“我请假了”，默认同事知道如何处理","为了不打扰别人，休假期间一直隐瞒任务状态","把文件发到大群，不说明谁接手","按规定请假，同时交代任务状态、资料位置、风险与接手人，确认对方理解"],"answer":3,"explanation":"建议选择：请假与负责并不矛盾。有效交接需要明确状态、材料、责任与时限，单向发文件不能确保接手。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"交接不仅交文件，还交状态和责任。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E025","category":"思想素质","topic":"公正合作","difficulty":1,"stem":"分配培训机会时，名额有限，你负责提出建议。合理依据应是？","options":["结合岗位需求、能力差距和公开规则提出名单，并保留理由","优先安排与自己关系好的同事","让声音最大、催促最多的人参加","按自己对人员的模糊印象决定，避免解释"],"answer":0,"explanation":"建议选择：培训资源应与工作需要和可说明的规则相联系。透明依据有助于公平，也比关系、施压或主观印象更利于组织发展。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"有限资源按规则与需求配置。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E026","category":"思想素质","topic":"创新与规范","difficulty":2,"stem":"你发现现行流程有一个可以简化的环节，但该环节仍是正式要求。应如何做？","options":["自行取消，等效果好再向上汇报","提出有依据的改进建议，按程序评估批准，在变更前执行现行有效要求","因为制度存在就不再提出意见","让同事也一起不执行，形成事实惯例"],"answer":1,"explanation":"建议选择：创新可以针对制度提出改进，但不能把个人判断直接替代有效要求。应走变更程序，说明收益、风险与控制措施。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"提建议可以主动，改规则需要授权。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E027","category":"思想素质","topic":"证据意识","difficulty":2,"stem":"两位同事对一次失误原因各执一词，你被安排协助复盘。应首先？","options":["选择资历更深同事的说法","让双方各承担一半责任以尽快结束","梳理时间线、记录和流程事实，分别听取说明，区分事实与判断","先确定责任人，再寻找支持该结论的材料"],"answer":2,"explanation":"建议选择：复盘需要基于证据还原过程，不能用资历、平均分责或预设结论取代调查。事实清楚后才便于识别个人与流程因素。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"先证据后结论，先过程后归责。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E028","category":"思想素质","topic":"社会公德","difficulty":3,"stem":"单位组织志愿活动，与你已承诺的必要值班工作冲突。合适的做法是？","options":["直接离岗参加，以体现公益热情","让不具备资格的朋友代为值班","认为工作冲突意味着今后都不参加公益","先履行岗位职责，说明冲突并在允许条件下协调替班或参加其他场次"],"answer":3,"explanation":"建议选择：公益与履职应协调，不能为正面活动破坏必要岗位保障。可在合规安排下寻找参与方式。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"善意活动也要兼顾既有职责。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E029","category":"思想素质","topic":"保密与工具","difficulty":1,"stem":"计划使用外部工具处理内部材料时，应考虑哪些事项？（多选）","options":["材料是否包含受限制的信息","工具和处理方式是否符合授权要求","是否可以采用经确认可公开的内容","工具免费就不必考虑数据流转"],"answer":[0,1,2],"explanation":"建议选择：数据类别、工具授权和可公开范围都与合规使用有关，是否免费不决定可否上传。 此为原创练习参考判断，不代表官方题型安排或评分标准。","tip":"上传即流转，先确认数据与工具权限。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质","type":"multiple"},{"id":"E030","category":"思想素质","topic":"接受反馈","difficulty":2,"stem":"导师指出你报告中的论证跳跃，你认为结论大概率正确。较好的回应是？","options":["强调自己做了很多工作，拒绝修改","询问具体问题，检查证据链并补充论证，必要时修正结论","只改格式，让报告看起来更完整","为了尽快结束讨论直接放弃所有结论"],"answer":1,"explanation":"建议选择：反馈针对论证质量，应落实到可核查的证据与推理。投入时间不等于论证充分，也不需要无分析地全部推翻。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"结论可信要有完整证据链。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E031","category":"思想素质","topic":"执行与反馈","difficulty":2,"stem":"上级安排一项任务，但你发现关键目标定义不明确。时间仍允许沟通。你应？","options":["凭个人偏好完成后再看是否符合要求","不断等上级主动补充，不开展任何准备","尽快确认交付标准、范围和期限，再推进并及时反馈理解偏差","要求对方写出每一个操作步骤，否则不做"],"answer":2,"explanation":"建议选择：主动澄清目标能减少返工。承担任务既不是盲目猜测，也不是等待一切细节被指定，可以先确认关键标准并自主推进。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"先对齐结果标准，再选择方法。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E032","category":"思想素质","topic":"群众沟通","difficulty":3,"stem":"在现场说明会上，居民用较激动的语气提出质疑。尚无安全威胁。你作为工作人员应？","options":["用同样音量反驳，让对方停止发言","立即承诺满足所有要求以平息情绪","以语气不礼貌为由拒绝任何沟通","保持克制，确认其核心诉求和事实，说明可核实信息与反馈渠道"],"answer":3,"explanation":"建议选择：情绪与诉求应区分。平和回应、澄清事实和提供反馈渠道有利于解决问题；对抗或过度承诺会增加矛盾。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"回应问题，避免被情绪带走。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E033","category":"思想素质","topic":"精细管理","difficulty":1,"stem":"你负责整理大量编号相近的设备资料，手工复制时容易串行。最有效的改进是？","options":["设计唯一编号校验和抽查机制，结合适当工具减少重复手工录入","只提醒自己更加认真，保持所有步骤不变","把编号字体放大后取消检查","发现错误后再修，认为提前检查浪费时间"],"answer":0,"explanation":"建议选择：精细管理既靠责任心也靠防错机制。唯一标识、校验和检查可以把“认真”落实为可执行流程。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"用机制防错，别只靠记忆和注意力。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E034","category":"思想素质","topic":"诚实求助","difficulty":2,"stem":"你被安排操作一种尚未接受必要培训的设备，有人说“照以前的样子做就行”。应如何处理？","options":["根据视频自行尝试，遇到问题再问","说明能力与培训缺口，请合格人员指导并按要求完成培训授权后再操作","为了不被看低，装作熟悉设备","借用他人的操作资格信息进入系统"],"answer":1,"explanation":"建议选择：如实说明能力边界是对安全和任务负责。未经必要培训授权不能以自学、模仿或借用身份替代。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"不会就说明，培训授权不能借用。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E035","category":"思想素质","topic":"组织承诺","difficulty":2,"stem":"你答应周五交付一份分析，但周三发现外部数据延迟，很可能无法按原计划完成。应？","options":["等到周五下班才通知延期","先交一份未标注缺失数据的完整结论","尽早告知影响，提出可先交付部分、替代方案和新的可行时间","避开相关消息，等数据到了再联系"],"answer":2,"explanation":"建议选择：守信不是保证任何情况下都不变，而是提前沟通变化、提供可行安排并兑现新约定。隐瞒会压缩协调时间。 此为原创情景训练的参考判断，不代表官方评分标准。","tip":"承诺有变化，越早沟通越负责。","sourceIds":[],"provenance":"原创模拟","priority":"核心","examSection":"思想素质"},{"id":"E036","category":"思想素质","topic":"理性决策","difficulty":3,"stem":"项目讨论中，一个方案得到多数支持，但你掌握一项可能改变风险判断的新数据。应？","options":["为保持一致不再提及","公开宣称所有支持者都不专业","只坚持自己的结论，不展示数据","提出数据来源与适用范围，建议复核其影响后再决定"],"answer":3,"explanation":"建议选择：有效异议基于证据并服务共同目标。应清楚说明信息与局限，让团队重新评估，而不是沉默或攻击人员。 此为原创情景训练的参考判断，不代表官
